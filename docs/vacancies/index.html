<script>
/* =========================================================
   Вакансии и резюме: данные
   Общие функции, шапка, окна и списки в ../shared/sous.js
   ========================================================= */
const SPECS = ["Мойка", "Полировка", "Химчистка", "Керамика", "Плёнки и PPF", "Администратор"];
const EXPERIENCE = ["Без опыта", "От 1 года", "От 3 лет"];
const SCHEDULES = ["Полный день", "Сменный", "Гибкий"];
const SALARY_STEPS = [["", "Любая"], ["60000", "от 60 000 ₽"], ["80000", "от 80 000 ₽"], ["100000", "от 100 000 ₽"]];

let VACANCIES = [
  { id: "vac-022", title: "Мастер по PPF", org: "Shine&Go", city: "Казань", from: 90000, to: 125000, schedule: "Полный день", exp: "От 3 лет", spec: "Плёнки и PPF", days: 0, verified: true, responses: 12, fresh: 3,
    desc: "Ищем мастера по установке полиуретановой плёнки в действующую детейлинг-студию. Современное оборудование, стабильный поток клиентов и понятная система премирования.",
    duties: ["Оклейка кузова полиуретановой плёнкой: полная и частичная", "Подготовка поверхности, раскрой и контроль качества", "Фотоотчёт по каждому автомобилю"],
    terms: ["Оформление по ТК, выплаты два раза в месяц", "Пятидневка, 10:00–19:00", "Плёнку и инструмент даёт студия"] , place: "Казань, ул. Сибирский тракт, филиал «Центральный»" },
  { id: "vac-021", title: "Детейлер-полировщик", org: "АвтоПрофи", city: "Москва", from: 110000, to: null, schedule: "Сменный", exp: "От 1 года", spec: "Полировка", days: 1, verified: true,
    desc: "Полировка кузова и фар, восстановительная и защитная обработка. Работа в команде из шести мастеров.",
    duties: ["Абразивная и защитная полировка кузова", "Восстановление фар и оптики", "Нанесение защитных составов"],
    terms: ["График 2/2 по 12 часов", "Оклад и процент от выработки", "Оплачиваемое обучение керамике"], place: "Москва, Варшавское шоссе" },
  { id: "vac-020", title: "Мойщик автомобилей", org: "CleanLab", city: "Санкт-Петербург", from: 65000, to: 80000, schedule: "Сменный", exp: "Без опыта", spec: "Мойка", days: 2, verified: true,
    desc: "Комплексная мойка, сушка и базовая уборка салона. Научим стандартам студии за первую неделю.",
    duties: ["Двухфазная мойка кузова", "Сушка и уборка салона", "Подготовка поста к следующему автомобилю"],
    terms: ["График 2/2", "Обучение за счёт компании", "Форма и химия выдаются"], place: "Санкт-Петербург, Приморский район" },
  { id: "vac-019", title: "Мастер химчистки салона", org: "Detail House", city: "Екатеринбург", from: 95000, to: null, schedule: "Полный день", exp: "От 1 года", spec: "Химчистка", days: 3, verified: true,
    desc: "Глубокая химчистка салонов, работа с профессиональной химией и оборудованием.",
    duties: ["Химчистка текстиля, кожи и потолка", "Озонирование и устранение запахов", "Консультация клиента по уходу"],
    terms: ["Пятидневка", "Процент от каждого заказа", "Профессиональное оборудование"], place: "Екатеринбург, ул. Малышева" },
  { id: "vac-018", title: "Специалист по керамике", org: "Гараж 77", city: "Москва", from: 100000, to: 140000, schedule: "Полный день", exp: "От 3 лет", spec: "Керамика", days: 5, verified: false,
    desc: "Подготовка кузова и нанесение керамических покрытий на премиальные автомобили.",
    duties: ["Подготовка лакокрасочного покрытия", "Нанесение керамики в 2–3 слоя", "Сдача автомобиля клиенту"],
    terms: ["Пятидневка", "Оклад и бонус за отзывы", "Работа с составами премиум-брендов"], place: "Москва, Ленинградский проспект" },
  { id: "vac-017", title: "Администратор детейлинг-студии", org: "Shine&Go", city: "Казань", from: 60000, to: 75000, schedule: "Сменный", exp: "Без опыта", spec: "Администратор", days: 6, verified: true, responses: 5, fresh: 0,
    desc: "Запись клиентов, приём и выдача автомобилей, работа с CRM студии.",
    duties: ["Запись и подтверждение визитов", "Приём автомобиля и фотофиксация", "Ведение клиентской базы"],
    terms: ["График 2/2", "Оклад и бонус от выручки", "Обучение работе с CRM"], place: "Казань, ул. Сибирский тракт, филиал «Центральный»" },
  { id: "vac-016", title: "Оклейщик винилом и PPF", org: "Wrap Lab", city: "Санкт-Петербург", from: 120000, to: null, schedule: "Полный день", exp: "От 3 лет", spec: "Плёнки и PPF", days: 7, verified: true,
    desc: "Полная и частичная оклейка автомобилей виниловыми и полиуретановыми плёнками.",
    duties: ["Оклейка кузова винилом и PPF", "Демонтаж старых плёнок", "Контроль качества кромок"],
    terms: ["Пятидневка", "Сдельная оплата с минимальной ставкой", "Плёнки ведущих производителей"], place: "Санкт-Петербург, Выборгский район" },
  { id: "vac-015", title: "Мойщик-универсал", org: "Мойка 24", city: "Казань", from: 55000, to: 70000, schedule: "Гибкий", exp: "Без опыта", spec: "Мойка", days: 9, verified: false,
    desc: "Мойка кузова, уборка салона, работа на круглосуточной мойке. Можно совмещать с учёбой.",
    duties: ["Мойка кузова и дисков", "Уборка салона", "Поддержание порядка на посту"],
    terms: ["Гибкий график, смены от 6 часов", "Выплаты каждую неделю", "Можно без опыта, научим"], place: "Казань, проспект Победы" },
];


/* ---------- Состояние страницы ---------- */
Object.assign(state, {
  q: "", city: "Все города",
  f: { spec: new Set(), exp: new Set(), schedule: new Set(), salary: "", verified: false },
  sort: "new",
  applied: new Set(),
  fav: new Set(),
  previewId: null,
});
const isMine = (v) => state.role === "employer" && v.org === ROLES.employer.name;

/* =========================================================
   Каталог
   ========================================================= */

function filtered() {
  const q = state.q.trim().toLowerCase();
  const { spec, exp, schedule, salary: min, verified } = state.f;
  let items = VACANCIES.filter((it) => {
    if (q && ![it.title, it.org, it.spec, it.desc].join(" ").toLowerCase().includes(q)) return false;
    if (state.city !== "Все города" && it.city !== state.city) return false;
    if (spec.size && !spec.has(it.spec)) return false;
    if (exp.size && !exp.has(it.exp)) return false;
    if (schedule.size && !schedule.has(it.schedule)) return false;
    if (min && (it.to || it.from) < Number(min)) return false;
    if (verified && !it.verified) return false;
    return true;
  });
  items = [...items].sort((a, b) => state.sort === "salary" ? (b.to || b.from) - (a.to || a.from) : a.days - b.days);
  if (state.role === "employer") items.sort((a, b) => isMine(b) - isMine(a));
  return items;
}

function activeChips() {
  const chips = [];
  if (state.city !== "Все города") chips.push(["city", state.city, state.city]);
  for (const key of ["spec", "exp", "schedule"]) state.f[key].forEach((v) => chips.push([key, v, v]));
  if (state.f.salary) chips.push(["salary", state.f.salary, SALARY_STEPS.find(([v]) => v === state.f.salary)[1]]);
  if (state.f.verified) chips.push(["verified", "1", "Проверенные компании"]);
  return chips;
}

function headAction() {
  const r = state.role;
  if (r === "employer") return `<button class="btn primary" data-act="create">${icon("plus")}<span class="l-full">Разместить вакансию</span><span class="l-short">Вакансия</span></button>`;
  if (r === "worker") return `<a class="btn" href="${pageHref("/specialists/worker-001")}">${icon("edit")}<span class="l-full">Моё резюме</span><span class="l-short">Резюме</span></a>`;
  if (r === "guest") return `<button class="btn" data-act="create">${icon("plus")}<span class="l-full">Разместить вакансию</span><span class="l-short">Вакансия</span></button>`;
  return "";
}

function roleNote() {
  const notes = {
    employer: `Ищете сотрудника сами? В разделе <a href="${pageHref("/specialists")}">Специалисты</a> резюме мастеров, которые ищут работу, их можно пригласить на вакансию`,
    client: `Здесь ищут работу и сотрудников. Чтобы найти мастера для своего автомобиля, <a href="${pageHref(`/orders`)}">оставьте заявку автовладельца</a>`,
    supplier: `Здесь ищут работу и сотрудников. Чтобы предложить товары студиям, откройте <a href="${pageHref(`/supply-requests`)}">заявки на закупку</a>`,
    partner: `Здесь ищут работу и сотрудников. Акции и кешбэк для клиентов настраиваются в <a href="${pageHref(`/promos`)}">разделе акций</a>`,
  };
  return notes[state.role] ? `<div class="note">${icon("info")}<p>${notes[state.role]}</p></div>` : "";
}

function filtersMarkup(prefix = "") {
  const all = VACANCIES;
  const counter = (key, v) => all.filter((it) => it[key] === v).length;
  const group = (title, key, values) => `<fieldset class="fgroup" style="border:0;margin:0;padding:0"><legend class="sr-only">${title}</legend><b>${title}</b>${values.filter((v) => counter(key, v) || state.f[key].has(v)).map((v) => `
    <label class="check"><input type="checkbox" data-filter="${key}" value="${esc(v)}" ${state.f[key].has(v) ? "checked" : ""}><span>${v}</span><span class="c num">${counter(key, v)}</span></label>`).join("")}</fieldset>`;
  return `${group("Специализация", "spec", SPECS)}
    ${group("Опыт", "exp", EXPERIENCE)}
    ${group("График", "schedule", SCHEDULES)}
    <div class="field"><span>Зарплата</span>${dd({ key: "salary", value: state.f.salary, options: SALARY_STEPS, label: "Зарплата" })}</div>
    <label class="toggle-row"><span>Только проверенные компании</span><input class="switch" type="checkbox" data-filter="verified" ${state.f.verified ? "checked" : ""}></label>`;
}

function vacancyCard(v) {
  const r = state.role, mine = isMine(v);
  let action = "";
  if (mine) action = `<a class="btn sm" href="#/v/${v.id}">${icon("users")}Отклики<span class="count">${v.responses}</span></a>`;
  else if (r === "guest" || r === "worker") action = state.applied.has(v.id)
    ? `<span class="btn sm done">${icon("check")}Отклик отправлен</span>`
    : `<button class="btn sm" data-act="apply" data-id="${v.id}">Откликнуться</button>`;
  const fav = mine ? "" : `<button class="btn sm ghost icon-only fav" data-act="fav" data-id="${v.id}" aria-pressed="${state.fav.has(v.id)}" aria-label="В избранное">${icon("bookmark", "lg")}</button>`;
  return `<article class="card ${mine ? "mine" : ""}">
    <div class="c-main">
      ${mine ? `<span class="mine-tag">${icon("dot")}Ваша вакансия${v.fresh ? `: ${plural(v.fresh, "новый отклик", "новых отклика", "новых откликов")}` : ""}</span>` : ""}
      <h2 class="c-title"><a href="#/v/${v.id}">${esc(v.title)}</a></h2>
      <div class="c-org">${esc(v.org)}${v.verified ? `${verifiedMark()}` : ""}</div>
      <div class="meta"><span>${icon("pin")}${v.city}</span><span>${icon("clock")}${v.schedule}</span><span>${icon("briefcase")}${v.exp}</span><span>${v.days === 0 ? "Сегодня" : ago(v.days)}</span></div>
      <p class="c-desc">${esc(v.desc)}</p>
    </div>
    <div class="c-side">
      <div class="money num">${salary(v.from, v.to)}<small>в месяц на руки</small></div>
      <div class="c-actions">${fav}${action}</div>
    </div>
  </article>`;
}

function specCounts() {
  return SPECS
    .filter((spec) => VACANCIES.some((v) => v.spec === spec))
    .map((spec) => [spec, VACANCIES.filter((v) => v.spec === spec).length]);
}

function quickSpecsBar() {
  return `<div class="spec-pills" role="group" aria-label="Быстрый выбор специализации">
    ${specCounts().map(([spec, count]) => `<button type="button" class="spec-pill" data-act="quick-spec" data-spec="${esc(spec)}" aria-pressed="${state.f.spec.has(spec)}">
      <span>${spec}</span><span class="c num">${count}</span>
    </button>`).join("")}
  </div>`;
}

function specShowcase() {
  return `<section class="spec-showcase" aria-label="Направления">
    ${specCounts().map(([spec, count]) => `<button type="button" class="spec-tile" data-act="quick-spec" data-spec="${esc(spec)}" aria-pressed="${state.f.spec.has(spec)}">
      <b class="num">${count}</b>
      <span>${spec}</span>
    </button>`).join("")}
  </section>`;
}

function spotlightPreview(items) {
  if (!items.length) return "";
  const v = items.find((x) => x.id === state.previewId) || items[0];
  const mine = isMine(v);
  const applied = state.applied.has(v.id);
  const r = state.role;
  let action = `<a class="btn primary" href="#/v/${v.id}">Открыть вакансию</a>`;
  if (!mine && (r === "guest" || r === "worker")) {
    action = applied
      ? `<span class="btn done">${icon("check")}Отклик отправлен</span>`
      : `<button class="btn primary" data-act="apply" data-id="${v.id}">Откликнуться</button>`;
  } else if (mine) {
    action = `<a class="btn primary" href="#/v/${v.id}">${icon("users")}Отклики<span class="count">${v.responses}</span></a>`;
  }
  return `<aside class="spotlight" aria-label="Предпросмотр вакансии">
    <div class="spotlight-head">
      <div>
        <div class="c-org">${esc(v.org)}${v.verified ? verifiedMark() : ""}</div>
        <h3><a href="#/v/${v.id}">${esc(v.title)}</a></h3>
      </div>
      <div class="money num">${salary(v.from, v.to)}<small>в месяц на руки</small></div>
    </div>
    <div class="meta"><span>${icon("pin")}${v.city}</span><span>${icon("clock")}${v.schedule}</span><span>${icon("briefcase")}${v.exp}</span><span>${v.days === 0 ? "Сегодня" : ago(v.days)}</span></div>
    <p class="spotlight-desc">${esc(v.desc)}</p>
    <div class="spotlight-block">
      <b>Обязанности</b>
      <ul class="bullets">${v.duties.map((d) => `<li>${icon("right")}<span>${esc(d)}</span></li>`).join("")}</ul>
    </div>
    <div class="spotlight-block">
      <b>Условия</b>
      <ul class="bullets">${v.terms.map((d) => `<li>${icon("check")}<span>${esc(d)}</span></li>`).join("")}</ul>
    </div>
    <div class="spotlight-actions">
      ${action}
      <a class="btn" href="#/v/${v.id}">Подробнее${icon("right")}</a>
    </div>
  </aside>`;
}

function redlineRow(v, activeId) {
  const active = v.id === activeId;
  return `<article class="card row-card ${active ? "is-selected" : ""}" data-preview-id="${v.id}">
    <div class="c-main">
      <h2 class="c-title"><a href="#/v/${v.id}" data-act="select-preview" data-id="${v.id}">${esc(v.title)}</a></h2>
      <div class="c-org">${esc(v.org)}${v.verified ? verifiedMark() : ""}</div>
      <div class="meta"><span>${icon("pin")}${v.city}</span><span>${icon("clock")}${v.schedule}</span><span>${v.days === 0 ? "Сегодня" : ago(v.days)}</span></div>
    </div>
    <div class="c-side">
      <div class="money num">${salary(v.from, v.to)}</div>
    </div>
  </article>`;
}

function resultsMarkup() {
  const items = filtered();
  const chips = activeChips();
  const word = plural(items.length, "вакансия", "вакансии", "вакансий");
  const design = vacancyDesign();
  const activeId = (items.find((x) => x.id === state.previewId) || items[0])?.id;

  const list = items.length
    ? `<div class="list">${design === "redline" ? items.map((v) => redlineRow(v, activeId)).join("") : items.map(vacancyCard).join("")}</div>`
    : `<div class="empty">${icon("search", "lg")}<h3>Ничего не нашлось</h3><p>Попробуйте другой город, уберите требования к опыту или сбросьте фильтры</p><button class="btn" data-act="reset">Сбросить фильтры</button></div>`;

  const hasSidebar = !design || design === "sprint" || design === "crimson";
  const toolbar = `<div class="toolbar">
      <p class="count"><b class="num">${word.split(" ")[0]}</b> ${word.split(" ").slice(1).join(" ")}</p>
      <button class="btn sm filters-btn" data-act="sheet">${icon("sliders")}Фильтры${chips.length ? `<span class="badge-n num">${chips.length}</span>` : ""}</button>
      ${hasSidebar ? "" : `<div class="sort-wrap">${dd({ key: "sort", value: state.sort, options: [["new", "Сначала новые"], ["salary", "Сначала с большей зарплатой"]], variant: "compact", label: "Сортировка" })}</div>`}
    </div>
    ${chips.length ? `<div class="chips">${chips.map(([k, v, l]) => `<button class="chip" data-act="unchip" data-k="${k}" data-v="${esc(v)}" aria-label="Убрать фильтр «${esc(l)}»">${esc(l)}${icon("x")}</button>`).join("")}<button class="link" data-act="reset" style="font-size:13px">Сбросить всё</button></div>` : ""}
    ${roleNote()}`;

  if (design === "sprint" || design === "pillbox") return `${quickSpecsBar()}${toolbar}${list}`;
  if (design === "ember") return `${specShowcase()}${toolbar}${list}`;
  if (design === "redline") {
    return `${toolbar}<div class="split-view">${list}${spotlightPreview(items)}</div>`;
  }
  return `${toolbar}${list}`;
}

function searchForm() {
  return `<form class="search" role="search" data-act-submit="search">
    <label class="s-field"><span class="sr-only">Поиск</span>${icon("search", "lg")}<input id="q" type="search" value="${esc(state.q)}" placeholder="Должность или компания" autocomplete="off"></label>
    <div class="s-field s-city">${dd({ key: "search-city", name: "city", value: state.city, options: CITIES, variant: "bare", iconName: "pin", label: "Город" })}</div>
    <button class="btn primary" type="submit">Найти</button>
  </form>`;
}

function workLinks() {
  return `<nav class="work-links" aria-label="Работа">
    <a class="btn primary" href="#/?design=original-html" aria-current="page">Вакансии</a>
    <a class="btn" href="${pageHref("/specialists")}">Резюме</a>
    <a class="btn" href="${pageHref("/companies")}">Компании</a>
    <a class="btn" href="${pageHref("/gigs")}">Подработки</a>
  </nav>`;
}

function catalogFilters() {
  return `<aside class="filters" aria-label="Фильтры">
    <div class="filters-head"><h2>Фильтры</h2>${activeChips().length ? `<button class="link" data-act="reset">Сбросить</button>` : ""}</div>
    <div class="field">${dd({ key: "sort", value: state.sort, options: [["new", "Сначала новые"], ["salary", "Сначала с большей зарплатой"]], label: "Сортировка" })}</div>
    ${filtersMarkup()}
  </aside>`;
}

function catalogView() {
  document.body.className = "catalog-page";
  document.title = "Вакансии · СОУС";
  const design = vacancyDesign();
  const lead = design
    ? `<p class="lead">Работа в автомойках, детейлинг-студиях и автосервисах</p>`
    : `<p class="lead">Постоянная работа в автомойках, детейлинг-студиях и автосервисах. Разовые смены ищите в разделе <a class="link accent" href="${pageHref("/gigs")}">Подработки</a></p>`;
  const isOrigRef = design === "original-html" || design === "proto-ref";
  const heading = `<div class="head-row">${design === "proto-ref" ? `<div><div class="proto-eyebrow">Работа</div><h1>Вакансии и резюме</h1></div>` : `<h1>${isOrigRef ? "Вакансии и резюме" : "Вакансии"}</h1>`}${isOrigRef ? "" : headAction()}</div>`;
  const results = `<section id="results" aria-live="polite">${resultsMarkup()}</section>`;
  const hasSidebar = !design || design === "sprint" || design === "crimson";
  const hasTopTools = isOrigRef || design === "redline" || design === "ember" || design === "editorial" || design === "pillbox" || design === "bento";
  return `<section class="head"><div class="wrap head-in">
      ${heading}${lead}
      ${isOrigRef ? workLinks() : ""}
      ${hasTopTools ? `<div class="reference-tools">${searchForm()}<button class="btn" data-act="sheet">${icon("sliders")}Фильтры</button>${isOrigRef ? headAction() : ""}</div>` : searchForm()}
    </div></section>
    <div class="wrap catalog">
      ${hasSidebar ? catalogFilters() : ""}
      ${results}
    </div>`;
}

/* =========================================================
   Детальная вакансии
   ========================================================= */
function detailView(id) {
  const catalogHref = state.vacancyCatalogHref || "#/";
  document.body.className = "detail-page";
  const v = VACANCIES.find((x) => x.id === id);
  if (!v) return `<div class="wrap detail"><a class="back" href="${catalogHref}">${icon("back")}Все вакансии</a><div class="empty"><h3>Вакансия снята с публикации</h3><p>Посмотрите похожие предложения в каталоге</p><a class="btn" href="${catalogHref}">К вакансиям</a></div></div>`;
  document.title = `${v.title} · ${v.org} · СОУС`;
  const r = state.role, mine = isMine(v), applied = state.applied.has(v.id);
  const related = VACANCIES.filter((x) => x.id !== v.id && (x.spec === v.spec || x.city === v.city)).slice(0, 3);
  while (related.length < 3) { const extra = VACANCIES.find((x) => x.id !== v.id && !related.includes(x)); if (!extra) break; related.push(extra); }

  let card, mbar;
  if (mine) {
    card = `<section class="panel action-card">
      <span class="mine-tag">${icon("dot")}Ваша вакансия</span>
      <div class="stat-row"><div><b class="num">${v.responses}</b><span>откликов</span></div><div><b class="num">${v.fresh}</b><span>новых</span></div></div>
      <a class="btn primary lg block" href="${pageHref(`/dashboard`)}">Смотреть отклики</a>
      <div class="grid2"><a class="btn" href="#" data-act="create" data-edit="${v.id}">${icon("edit")}Изменить</a><button class="btn" data-act="unpublish" data-id="${v.id}">Снять</button></div>
    </section>`;
    mbar = `<a class="btn primary" href="${pageHref(`/dashboard`)}">Отклики<span class="count">${v.responses}</span></a>`;
  } else if (r === "guest" || r === "worker") {
    const btn = applied ? `<span class="btn lg block done">${icon("check")}Отклик отправлен</span>` : `<button class="btn primary lg block" data-act="apply" data-id="${v.id}">Откликнуться</button>`;
    card = `<section class="panel action-card">
      <div class="money num">${salary(v.from, v.to)}<small>в месяц на руки</small></div>
      ${btn}
      <button class="btn block fav" data-act="fav" data-id="${v.id}" aria-pressed="${state.fav.has(v.id)}">${icon("bookmark")}${state.fav.has(v.id) ? "В избранном" : "Сохранить"}</button>
    </section>`;
    mbar = applied ? `<span class="btn done">${icon("check")}Отправлен</span>` : `<button class="btn primary" data-act="apply" data-id="${v.id}">Откликнуться</button>`;
  } else {
    const why = r === "employer" ? "Работодатели не откликаются на вакансии. Ваши вакансии и отклики находятся в кабинете" : "Откликаться на вакансии могут специалисты";
    card = `<section class="panel action-card">
      <div class="money num">${salary(v.from, v.to)}<small>в месяц на руки</small></div>
      <p class="hint">${icon("info")}${why}</p>
      ${r === "employer" ? `<button class="btn primary block" data-act="create">${icon("plus")}Разместить свою вакансию</button>` : ""}
    </section>`;
    mbar = r === "employer" ? `<button class="btn primary" data-act="create">Разместить вакансию</button>` : "";
  }

  return `<div class="wrap detail">
    <a class="back" href="${catalogHref}">${icon("back")}Все вакансии</a>
    <div class="d-grid">
      <div class="d-main">
        <section class="panel d-head">
          <h1>${esc(v.title)}</h1>
          <div class="d-org"><div><b>${esc(v.org)}</b><span class="parts">${v.verified ? `<span class="verified">${icon("badge")}Документы проверены</span>` : ""}<span>${v.city}</span></span></div></div>
          <div class="facts">
            <div><b class="num">${salary(v.from, v.to)}</b><span>в месяц на руки</span></div>
            <div><b>${v.schedule}</b><span>график</span></div>
            <div><b>${v.exp}</b><span>опыт</span></div>
            <div><b>${ago(v.days)}</b><span>опубликована</span></div>
          </div>
        </section>
        <section class="panel"><h2>О работе</h2><p class="prose">${esc(v.desc)}</p></section>
        <section class="panel"><h2>Что делать</h2><ul class="bullets">${v.duties.map((d) => `<li>${icon("right")}<span>${esc(d)}</span></li>`).join("")}</ul></section>
        <section class="panel"><h2>Условия</h2><ul class="bullets">${v.terms.map((d) => `<li>${icon("check")}<span>${esc(d)}</span></li>`).join("")}</ul></section>
        <section class="panel"><h2>Где работать</h2><p class="place">${icon("pin", "lg")}<span>${esc(v.place)}. Точный адрес работодатель пришлёт после отклика</span></p></section>
        <button class="report" data-act="report">${icon("flag")}Пожаловаться на вакансию</button>
      </div>
      <aside class="aside">
        ${card}
        <section class="panel org-card">
          <div class="d-org"><span class="tile">${initials(v.org)}</span><div><b>${esc(v.org)}</b><span>${v.city}</span></div></div>
          <div class="org-line"><span>Рейтинг</span><b class="num">${v.verified ? "10/10" : "Пока нет отзывов"}</b></div>
          <div class="org-line"><span>Открытых вакансий</span><b class="num">${VACANCIES.filter((x) => x.org === v.org).length}</b></div>
          <a class="btn block" href="${companyHref(v.org)}">Профиль компании</a>
        </section>
      </aside>
    </div>
    <section class="related">
      <h2>Похожие вакансии</h2>
      <div class="related-grid">${related.map((x) => `<a class="mini" href="#/v/${x.id}"><b>${esc(x.title)}</b><span>${esc(x.org)}, ${x.city}</span><span class="money num">${salary(x.from, x.to)}</span></a>`).join("")}</div>
    </section>
  </div>
  ${mbar ? `<div class="mbar"><div class="money num">${salary(v.from, v.to)}<small>в месяц</small></div>${mbar}</div>` : ""}`;
}


/* =========================================================
   Окна страницы
   ========================================================= */
function applyModal(id) {
  const v = VACANCIES.find((x) => x.id === id);
  openModal(`${mHead("Отклик на вакансию", `${esc(v.title)}, ${esc(v.org)}`)}
    <form class="m-body" id="mform">
      <div class="resume-mini"><span class="tile round">МС</span><div><b>Михаил Соколов</b><span>Детейлер, опыт 6 лет. Резюме заполнено на 87%</span></div><a class="link" href="${pageHref(`/resume/resume-001/edit`)}">Изменить</a></div>
      <label class="field"><span>Сообщение работодателю</span><textarea class="textarea" name="msg" placeholder="Коротко о себе и когда готовы выйти" autofocus></textarea></label>
    </form>
    <div class="m-foot"><button class="btn" data-act="close">Отмена</button><button class="btn primary" data-act="apply-send" data-id="${id}">${icon("send")}Отправить отклик</button></div>`);
}

function applySuccess(id) {
  const v = VACANCIES.find((x) => x.id === id);
  $("#modal-root .modal").innerHTML = `${mHead("", "")}<div class="m-body"><div class="success"><span class="ok-circle">${icon("check")}</span><h3>Отклик отправлен</h3><p>${esc(v.org)} получит ваше резюме в личных сообщениях. Ответ придёт туда же, мы пришлём уведомление</p></div></div>
    <div class="m-foot"><button class="btn" data-act="close">К вакансиям</button><a class="btn primary" href="${pageHref(`/messages`)}">Открыть сообщения</a></div>`;
}

function createModal(editId) {
  const guest = state.role === "guest";
  const v = editId ? VACANCIES.find((x) => x.id === editId) : null;
  openModal(`${mHead(v ? "Изменить вакансию" : "Новая вакансия", guest ? "Заполните без регистрации: черновик сохранится, а опубликовать можно после входа" : "После проверки вакансия появится в каталоге и в поиске")}
    <form class="m-body" id="mform">
      <label class="field"><span>Должность</span><input class="input" name="title" required placeholder="Например, детейлер-полировщик" value="${v ? esc(v.title) : ""}" autofocus></label>
      <div class="grid2">
        <div class="field"><span>Специализация</span>${dd({ key: "f-spec", name: "spec", value: v?.spec, options: SPECS })}</div>
        ${guest ? `<div class="field"><span>Город</span>${dd({ key: "f-city", name: "city", value: "Казань", options: CITIES.slice(1) })}</div>`
                : `<div class="field"><span>Филиал</span>${dd({ key: "f-branch", name: "city", value: "Казань, «Центральный»", options: ["Казань, «Центральный»", "Казань, «Северный»"] })}</div>`}
      </div>
      <div class="grid2">
        <div class="field"><span>График</span>${dd({ key: "f-schedule", name: "schedule", value: v?.schedule, options: SCHEDULES })}</div>
        <div class="field"><span>Опыт</span>${dd({ key: "f-exp", name: "exp", value: v?.exp, options: EXPERIENCE })}</div>
      </div>
      <div class="grid2">
        <label class="field"><span>Зарплата от, ₽</span><input class="input num" name="from" inputmode="numeric" required placeholder="80 000" value="${v ? v.from : ""}"></label>
        <label class="field"><span>Зарплата до, ₽</span><input class="input num" name="to" inputmode="numeric" placeholder="120 000" value="${v?.to || ""}"></label>
      </div>
      <label class="field"><span>Что делать и какие условия</span><textarea class="textarea" name="desc" required placeholder="Обязанности, график, что даёт компания">${v ? esc(v.desc) : ""}</textarea></label>
    </form>
    <div class="m-foot">${guest ? `<button class="btn" data-act="close">Отмена</button><button class="btn primary" data-act="create-send">Сохранить и войти</button>`
      : `<button class="btn" data-act="close">Отмена</button><button class="btn primary" data-act="create-send" data-edit="${editId || ""}">${v ? "Сохранить" : "Разместить"}</button>`}</div>`);
}

function unpublishModal(id) {
  const v = VACANCIES.find((x) => x.id === id);
  openModal(`${mHead("Снять вакансию с публикации?", `«${esc(v.title)}» исчезнет из каталога. Отклики сохранятся в кабинете, вакансию можно вернуть`)}
    <div class="m-foot"><button class="btn" data-act="close" autofocus>Отмена</button><button class="btn primary" data-act="unpublish-send" data-id="${id}">Снять</button></div>`);
}

function reportModal() {
  openModal(`${mHead("Пожаловаться на вакансию")}
    <form class="m-body" id="mform">
      ${["Недостоверные условия", "Просят оплату за трудоустройство", "Компания не существует", "Другое"].map((t, i) => `<label class="check"><input type="radio" name="r" style="border-radius:50%" ${i === 0 ? "checked" : ""}><span>${t}</span></label>`).join("")}
      <label class="field"><span>Комментарий</span><textarea class="textarea" placeholder="Что не так"></textarea></label>
    </form>
    <div class="m-foot"><button class="btn" data-act="close">Отмена</button><button class="btn primary" data-act="report-send">Отправить</button></div>`);
}

function filtersSheet() {
  openModal(`${mHead("Фильтры")}<div class="m-body"><div class="sheet-filters" id="sheet"><div class="field"><span>Сортировка</span>${dd({ key: "sort", value: state.sort, options: [["new", "Сначала новые"], ["salary", "Сначала с большей зарплатой"]], label: "Сортировка" })}</div>${filtersMarkup("m")}</div></div>
    <div class="m-foot"><button class="btn" data-act="reset">Сбросить</button><button class="btn primary" data-act="close" id="sheet-apply">Показать: ${filtered().length}</button></div>`);
}

/* =========================================================
   Обновление списка и фильтров
   ========================================================= */
function renderResults() {
  const el = $("#results");
  if (el) el.innerHTML = resultsMarkup();
  const fh = $(".filters-head");
  if (fh) fh.innerHTML = `<h2>Фильтры</h2>${activeChips().length ? `<button class="link" data-act="reset" style="font-size:13px">Сбросить</button>` : ""}`;
  const sa = $("#sheet-apply");
  if (sa) sa.textContent = `Показать: ${filtered().length}`;
}
function syncFilterInputs() {
  $$("[data-filter]").forEach((el) => {
    const k = el.dataset.filter;
    if (k === "verified") el.checked = state.f.verified;
    else el.checked = state.f[k].has(el.value);
  });
  $$('[data-dd="salary"]').forEach((el) => setDD(el, state.f.salary));
  $$('[data-dd="sort"]').forEach((el) => setDD(el, state.sort));
  $$('[data-dd="search-city"]').forEach((el) => setDD(el, state.city));
}
function resetFilters() {
  state.f = { spec: new Set(), exp: new Set(), schedule: new Set(), salary: "", verified: false };
  state.city = "Все города"; state.q = "";
  const q = $("#q"); if (q) q.value = "";
  syncFilterInputs(); renderResults();
}
function refresh() { if (route().startsWith("/v/")) render(); else renderResults(); }

document.addEventListener("input", (e) => {
  if (e.target.id === "q") { state.q = e.target.value; renderResults(); }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  const k = t.dataset.filter;
  if (!k) return;
  if (k === "verified") state.f.verified = t.checked;
  else t.checked ? state.f[k].add(t.value) : state.f[k].delete(t.value);
  syncFilterInputs(); renderResults();
});
document.addEventListener("submit", (e) => { e.preventDefault(); if (e.target.dataset.actSubmit === "search") { $("#results")?.scrollIntoView({ behavior: "smooth", block: "start" }); } });

/* =========================================================
   Описание страницы для общего скрипта
   ========================================================= */
const PAGE = {
  section: "/vacancies",
  currentPath: () => route().startsWith("/v/") ? "/vacancies/:id" : "/vacancies",
  render() {
    const m = route().match(/^\/v\/([\w-]+)/);
    $("#app").innerHTML = m ? detailView(m[1]) : catalogView();
  },
  onRoute() {
    if (route() === "/resumes") location.replace(pageHref("/specialists"));
    const design = vacancyDesign();
    const root = document.documentElement;
    if (design) {
      root.dataset.vacancyDesign = design;
      root.dataset.theme = read("sous-design-theme", "dark");
    } else {
      delete root.dataset.vacancyDesign;
      root.dataset.theme = "dark";
    }
    if (!route().startsWith("/v/")) state.vacancyCatalogHref = design ? `#/?design=${design}` : "#/";
  },
  onDD(key, v) {
    if (key === "search-city") state.city = v;
    else if (key === "sort") state.sort = v;
    else if (key === "salary") state.f.salary = v;
    else return false;
    syncFilterInputs(); renderResults();
    return true;
  },
  authText(kind, id) {
    return {
      apply: ["Войдите, чтобы откликнуться", `После входа вернём вас к вакансии «${esc(VACANCIES.find((v) => v.id === id)?.title || "")}», и отклик можно будет отправить сразу`],
      fav: ["Войдите, чтобы сохранить", "Избранные вакансии будут в кабинете на любом устройстве"],
    }[kind];
  },
  loginRole: () => "worker",
  afterLogin(p) {
    if (p.kind === "apply" && p.id) setTimeout(() => applyModal(p.id), 200);
    if (p.kind === "fav" && p.id) { state.fav.add(p.id); refresh(); }
  },
  roleHints: { guest: "смотрит без входа", worker: "ищет работу", employer: "размещает вакансии", client: "не целевая роль", supplier: "не целевая роль", partner: "не целевая роль" },
  actions: {
    reset: resetFilters,
    "quick-spec": (el) => {
      const spec = el.dataset.spec;
      if (state.f.spec.has(spec)) state.f.spec.delete(spec);
      else state.f.spec.add(spec);
      syncFilterInputs(); renderResults();
      $$("[data-act=quick-spec]").find((button) => button.dataset.spec === spec)?.focus({ preventScroll: true });
    },
    "select-preview": (el, e) => {
      if (vacancyDesign() !== "redline" || window.innerWidth <= 960) return;
      e.preventDefault();
      state.previewId = el.dataset.id;
      renderResults();
    },
    unchip: (el, e, id) => {
      const { k, v } = el.dataset;
      if (k === "city") state.city = "Все города";
      else if (k === "salary") state.f.salary = "";
      else if (k === "verified") state.f.verified = false;
      else state.f[k].delete(v);
      syncFilterInputs(); renderResults();
    },
    sheet: filtersSheet,
    apply: (el, e, id) => { if (!needAuth("apply", id)) applyModal(id); },
    "apply-send": (el, e, id) => { state.applied.add(id); applySuccess(id); refresh(); },
    fav: (el, e, id) => {
      if (needAuth("fav", id)) return;
      state.fav.has(id) ? state.fav.delete(id) : state.fav.add(id);
      toast(state.fav.has(id) ? "Сохранено в избранное" : "Убрано из избранного", state.fav.has(id) ? "Избранное хранится в личном кабинете" : "");
      refresh();
    },
    create: (el, e, id) => { e.preventDefault(); if (["guest", "employer"].includes(state.role)) createModal(el.dataset.edit); },
    "create-send": (el, e, id) => {
      const f = $("#mform");
      if (!f.reportValidity()) return;
      if (state.role === "guest") { closeModal(); state.pendingAction = null; toast("Черновик сохранён", "Войдите как работодатель, чтобы опубликовать"); setTimeout(() => setRole("employer"), 400); return; }
      const d = Object.fromEntries(new FormData(f));
      const num = (s) => Number(String(s).replace(/\D/g, "")) || 0;
      if (el.dataset.edit) {
        Object.assign(VACANCIES.find((v) => v.id === el.dataset.edit), { title: d.title, spec: d.spec, schedule: d.schedule, exp: d.exp, from: num(d.from), to: num(d.to) || null, desc: d.desc });
        closeModal(); toast("Вакансия обновлена", "Изменения появятся в каталоге через 1–2 минуты"); render(); return;
      }
      VACANCIES.unshift({ id: "vac-" + Date.now(), title: d.title, org: "Shine&Go", city: "Казань", from: num(d.from), to: num(d.to) || null, schedule: d.schedule, exp: d.exp, spec: d.spec, days: 0, verified: true, responses: 0, fresh: 0,
        desc: d.desc, duties: [d.desc], terms: ["Условия уточняются у работодателя"], place: d.city });
      closeModal(); location.hash = state.vacancyCatalogHref || "#/"; render(); toast("Вакансия размещена", "Она уже в каталоге, отклики придут в «Сообщения»");
    },
    unpublish: (el, e, id) => unpublishModal(id),
    "unpublish-send": (el, e, id) => { VACANCIES = VACANCIES.filter((v) => v.id !== id); closeModal(); location.hash = state.vacancyCatalogHref || "#/"; toast("Вакансия снята с публикации", "Вернуть её можно в кабинете"); },
    report: reportModal,
    "report-send": (el, e, id) => { closeModal(); toast("Жалоба отправлена", "Ответ придёт в уведомления"); },
  },
};

start();
</script>
</body>
</html>
