<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Компании · СОУС</title>
<meta name="description" content="Переработанный каталог компаний СОУС: автомойки, детейлинг-центры и автосервисы с услугами, филиалами, вакансиями и отзывами">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alumni+Sans:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/sous.css?v=202611280200">
<style>
.head-row h1{margin:0}
.d-person .tile.sq{border-radius:20px}
@media (max-width:640px){.d-person .tile.sq{border-radius:16px}}
.prices,.branches,.jobs{display:grid;gap:8px}
.price{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:16px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--fill)}
.price b,.branch b,.job b{display:block;font-size:15px;font-weight:600}
.price span,.branch span,.job span{font-size:13px;color:var(--text-3)}
.price .num{font-size:15px;font-weight:600;white-space:nowrap}
.branch{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px 16px;border-radius:12px;background:var(--fill)}
.branch>.icon{margin-top:2px;color:var(--text-3)}
.branch .link{font-size:13px}
.job{display:grid;grid-template-columns:minmax(0,1fr) auto 16px;gap:16px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--fill);transition:background-color .16s var(--ease)}
.job:hover{background:var(--fill-2)}
.job>.icon{color:var(--text-3)}
.job .num{font-weight:600;white-space:nowrap}
.dir-line{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text-2)}
.dir-line .icon{color:var(--text-3)}
.c-org .dir{font-size:13px;color:var(--text-3)}
@media (max-width:640px){
  .price{grid-template-columns:minmax(0,1fr) auto}
  .price .btn{grid-column:1/-1}
  .job{grid-template-columns:minmax(0,1fr) 16px}
  .job .num{grid-column:1;grid-row:2;font-size:14px}
  .job>.icon{grid-column:2;grid-row:1/3}
}
/* Режим работы и адрес длиннее чисел: даём им шире колонку, чтобы строка не переносилась */
@media (min-width:641px){
  .c-facts{grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.8fr)}
  .d-facts{grid-template-columns:minmax(0,1.6fr) minmax(0,1.2fr) minmax(0,1.6fr) minmax(0,.7fr)}
}
/* На телефоне: три числа в ряд, режим работы отдельной строкой */
@media (max-width:640px){
  .c-facts{grid-template-columns:repeat(3,minmax(0,1fr))}
  .c-facts div:nth-child(3){padding-left:16px;border-left:1px solid var(--line)}
  .c-facts div:last-child{grid-column:1/-1;padding-left:0;border-left:0}
  .d-facts{grid-auto-flow:row dense}
  .d-facts div:nth-child(1),.d-facts div:nth-child(3){grid-column:1/-1}
  .d-facts div:nth-child(2),.d-facts div:nth-child(3){padding-left:0;border-left:0}
  .d-facts div:nth-child(2) b{white-space:nowrap}
  .d-facts div:nth-child(4){padding-left:16px;border-left:1px solid var(--line)}
}
</style>
</head>
<body>

<script>
/* =========================================================
   Компании: каталог (#/), профиль (#/v/id), карточка открытого каталога (#/d/id)
   ========================================================= */
const TYPES = ["Автомойка", "Детейлинг-центр", "Автосервис"];
const CATS = ["Мойка", "Химчистка", "Полировка", "Керамика", "Оклейка плёнкой", "Ремонт и ТО"];
const SORTS = [["rating", "Сначала с высоким рейтингом"], ["reviews", "Больше отзывов"], ["jobs", "Больше вакансий"]];

const WASH = [["Мойка кузова", "Двухфазная, с сушкой", 900], ["Комплексная мойка", "Кузов, салон и стёкла", 1500], ["Химчистка салона", "Текстиль или кожа", 9000], ["Полировка фар", "Шлифовка и защитный лак", 2500]];
const DETAIL = [["Восстановительная полировка", "Абразивная, в 2–3 этапа", 18000], ["Керамическое покрытие", "Подготовка и два слоя", 32000], ["Оклейка PPF", "Зоны риска или кузов целиком", 65000], ["Химчистка салона", "Текстиль, кожа и потолок", 12000]];
const AUTO = [["Замена масла", "С фильтром", 1500], ["Диагностика ходовой", "На подъёмнике", 1200], ["Локальная покраска", "Элемент кузова", 9000], ["Полировка кузова", "В один этап", 15000]];

/* jobs: [вид, id, название, оплата] из разделов «Вакансии» и «Подработки» */
const COMPANIES = [
  { id: "company-001", name: "Shine&Go", type: "Детейлинг-центр", city: "Казань", verified: true, rating: "9,8", reviews: 42, since: "марта 2026", hours: "Ежедневно, 9:00–21:00",
    cats: ["Полировка", "Керамика", "Оклейка плёнкой", "Химчистка"], services: DETAIL,
    desc: "Детейлинг-центр полного цикла: защита кузова, полировка, керамика и химчистка. Перед началом работ фиксируем объём, стоимость и срок выдачи.",
    branches: [["Центральный", "Казань", "ул. Пушкина, 24"], ["Северный", "Казань", "пр. Ямашева, 71"], ["Азино", "Казань", "ул. Юлиуса Фучика, 90"]],
    jobs: [["vacancy", "vac-022", "Мастер по PPF", "90 000–125 000 ₽"], ["vacancy", "vac-017", "Администратор детейлинг-студии", "60 000–75 000 ₽"], ["gig", "gig-016", "Универсал на выходные", "9 500 ₽"], ["gig", "gig-009", "Администратор на субботу", "3 000 ₽"]],
    works: ["PPF на капот и бампер", "Керамика на кроссовер", "Химчистка кожаного салона"],
    reviewsList: [["Анна, клиент", "Ноябрь 2026", "Сделали полировку и керамику за два дня, как обещали. Перед работой показали замеры толщиномером и согласовали цену"], ["Михаил Соколов, бывший сотрудник", "Октябрь 2026", "Брали на подработку под оклейку. Нормальный пост, свет, материалы студии, оплата в день смены"]] },
  { id: "company-002", name: "CleanLab", type: "Автомойка", city: "Москва", verified: true, rating: "9,4", reviews: 31, since: "апреля 2026", hours: "Круглосуточно",
    cats: ["Мойка", "Химчистка"], services: WASH,
    desc: "Сеть автомоек в Москве и Петербурге. Единый регламент двухфазной мойки, обученный персонал и запись онлайн.",
    branches: [["Хамовники", "Москва", "Комсомольский пр., 15"], ["Мурино", "Санкт-Петербург", "Привокзальная пл., 3"]],
    jobs: [["vacancy", "vac-020", "Мойщик автомобилей", "65 000–80 000 ₽"], ["gig", "gig-015", "Мойщик на смену завтра", "2 500 ₽ за смену"]],
    works: ["Двухфазная мойка кроссовера", "Мойка дисков", "Уборка салона"],
    reviewsList: [["Олег, клиент", "Ноябрь 2026", "Мою машину тут каждую неделю. Быстро, без разводов, по записи без очереди"], ["Дмитрий Ким, сотрудник", "Сентябрь 2026", "Понятный регламент, смены ставят заранее, выплаты без задержек"]] },
  { id: "company-003", name: "АвтоПрофи", type: "Автосервис", city: "Москва", verified: true, rating: "9,2", reviews: 27, since: "марта 2026", hours: "Пн–Сб, 9:00–20:00",
    cats: ["Ремонт и ТО", "Полировка", "Керамика"], services: AUTO,
    desc: "Техническое обслуживание, кузовной ремонт и детейлинг премиальных автомобилей. Работаем по записи, смету согласуем до начала.",
    branches: [["Каширское шоссе", "Москва", "Каширское ш., 61"]],
    jobs: [["vacancy", "vac-021", "Детейлер-полировщик", "от 110 000 ₽"], ["gig", "gig-014", "Полировщик на один автомобиль", "7 000 ₽"]],
    works: ["Локальная покраска крыла", "Полировка после ремонта", "Керамика на седан"],
    reviewsList: [["Сергей, клиент", "Октябрь 2026", "Поменяли масло и сделали диагностику за час. Смету прислали в сообщения заранее"]] },
  { id: "company-004", name: "Detail House", type: "Детейлинг-центр", city: "Екатеринбург", verified: true, rating: "9,6", reviews: 19, since: "мая 2026", hours: "Ежедневно, 10:00–21:00",
    cats: ["Химчистка", "Полировка", "Керамика"], services: DETAIL,
    desc: "Детейлинг-центр с упором на химчистку и восстановление салона. Своя команда полировки и обучение мастеров.",
    branches: [["Центр", "Екатеринбург", "ул. Малышева, 51"]],
    jobs: [["vacancy", "vac-019", "Мастер химчистки салона", "от 95 000 ₽"], ["gig", "gig-013", "Подмена мастера химчистки", "4 500 ₽"]],
    works: ["Химчистка сидений", "Потолок и стойки", "Восстановление кожи"],
    reviewsList: [["Ирина, клиент", "Ноябрь 2026", "Вывели пятна с потолка, которые нигде не брались. Салон без запаха химии"]] },
  { id: "company-005", name: "Гараж 77", type: "Детейлинг-центр", city: "Москва", verified: false, rating: "9,0", reviews: 12, since: "июня 2026", hours: "Ежедневно, 10:00–22:00",
    cats: ["Керамика", "Полировка"], services: DETAIL,
    desc: "Небольшая студия керамики и полировки. Работаем под лампами и толщиномером, принимаем по записи.",
    branches: [["Южный порт", "Москва", "2-й Южнопортовый пр., 18"]],
    jobs: [["vacancy", "vac-018", "Специалист по керамике", "100 000–140 000 ₽"], ["gig", "gig-011", "Керамика на два автомобиля", "12 000 ₽"]],
    works: ["Керамика на седан", "Подготовка ЛКП", "Контроль под лампой"],
    reviewsList: [["Павел, клиент", "Сентябрь 2026", "Керамику сделали аккуратно, показали результат под лампой"]] },
  { id: "company-006", name: "Wrap Lab", type: "Детейлинг-центр", city: "Санкт-Петербург", verified: true, rating: "9,7", reviews: 23, since: "апреля 2026", hours: "Пн–Сб, 10:00–20:00",
    cats: ["Оклейка плёнкой", "Полировка"], services: [["Оклейка PPF", "Кузов целиком", 180000], ["Оклейка зон риска", "Капот, бампер, фары", 45000], ["Оклейка винилом", "Смена цвета", 120000], ["Демонтаж плёнки", "Без следов клея", 15000]],
    desc: "Оклейка полиуретановой и виниловой плёнкой. Раскрой по лекалам и вручную, гарантия на кромки.",
    branches: [["Васильевский", "Санкт-Петербург", "Средний пр. В.О., 88"]],
    jobs: [["vacancy", "vac-016", "Оклейщик винилом и PPF", "от 120 000 ₽"], ["gig", "gig-012", "Помощник на оклейку PPF", "5 000 ₽"]],
    works: ["PPF на капот", "Полная оклейка", "Кромки и стыки"],
    reviewsList: [["Алексей, клиент", "Октябрь 2026", "Оклеили капот и бампер, кромки ровные, через месяц ничего не отошло"]] },
  { id: "company-007", name: "Мойка 24", type: "Автомойка", city: "Казань", verified: true, rating: "8,8", reviews: 54, since: "марта 2026", hours: "Круглосуточно",
    cats: ["Мойка", "Химчистка"], services: WASH,
    desc: "Круглосуточная автомойка на четыре поста. Мойка без записи, химчистка по записи.",
    branches: [["Горки", "Казань", "пр. Победы, 141"], ["Савиново", "Казань", "ул. Гаврилова, 5"]],
    jobs: [["vacancy", "vac-015", "Мойщик-универсал", "55 000–70 000 ₽"], ["gig", "gig-010", "Мойщик в ночную смену", "3 500 ₽ за смену"]],
    works: ["Комплексная мойка", "Мойка двигателя", "Уборка салона"],
    reviewsList: [["Руслан, клиент", "Ноябрь 2026", "Удобно, что работают ночью. Помыли за 25 минут"]] },
];
/* Открытый каталог: карточки, которые компания ещё не подтвердила */
const DIRECTORY = [
  { id: "directory-001", name: "Аква Стар", type: "Автомойка", city: "Москва", address: "ул. Профсоюзная, 104", phone: "+7 (495) 120-44-18", hours: "Ежедневно, 8:00–23:00", cats: ["Мойка", "Химчистка"], services: ["Мойка кузова", "Комплексная мойка", "Химчистка салона"] },
  { id: "directory-002", name: "Кузов Мастер", type: "Автосервис", city: "Екатеринбург", address: "ул. Шефская, 3", phone: "+7 (343) 310-27-90", hours: "Пн–Пт, 9:00–19:00", cats: ["Ремонт и ТО"], services: ["Кузовной ремонт", "Покраска элементов", "Удаление вмятин без покраски"] },
];
const MY_COMPANY = "company-001";

/* ---------- Состояние ---------- */
const emptyFilters = () => ({ type: new Set(), cat: new Set(), jobs: false, verified: false });
Object.assign(state, { q: "", city: "Все города", f: emptyFilters(), sort: "rating", followed: new Set(), phones: new Set(), claimed: new Set() });
const byId = (id) => COMPANIES.find((c) => c.id === id) || DIRECTORY.find((c) => c.id === id);
const isDir = (c) => c.id.startsWith("directory");
const isMine = (c) => state.role === "employer" && c.id === MY_COMPANY;
const vacCount = (c) => (c.jobs || []).length;
const reviewsWord = (n) => plural(n, "отзыв", "отзыва", "отзывов");
const jobsWord = (n) => plural(n, "вакансия", "вакансии", "вакансий");
const jobHref = ([kind, id]) => pageHref(kind === "gig" ? `/gigs/${id}` : `/vacancies/${id}`);
const services = (c) => isDir(c) ? c.services : c.services.map(([n]) => n);

/* =========================================================
   Каталог
   ========================================================= */
function filtered() {
  const q = state.q.trim().toLowerCase(), { type, cat, jobs, verified } = state.f;
  const num = (r) => Number(String(r || "0").replace(",", "."));
  const by = { rating: (a, b) => num(b.rating) - num(a.rating), reviews: (a, b) => (b.reviews || 0) - (a.reviews || 0), jobs: (a, b) => vacCount(b) - vacCount(a) }[state.sort];
  return [...COMPANIES, ...DIRECTORY].filter((c) => {
    if (q && ![c.name, c.type, c.city, c.cats.join(" "), c.desc || "", services(c).join(" "), (c.branches || []).flat().join(" "), c.address || ""].join(" ").toLowerCase().includes(q)) return false;
    if (state.city !== "Все города" && c.city !== state.city && !(c.branches || []).some(([, city]) => city === state.city)) return false;
    if (type.size && !type.has(c.type)) return false;
    if (cat.size && !c.cats.some((x) => cat.has(x))) return false;
    if (jobs && !vacCount(c)) return false;
    if (verified && !c.verified) return false;
    return true;
  }).sort(by).sort((a, b) => isDir(a) - isDir(b));
}

function activeChips() {
  const chips = [];
  if (state.city !== "Все города") chips.push(["city", state.city, state.city]);
  for (const k of ["type", "cat"]) state.f[k].forEach((v) => chips.push([k, v, v]));
  if (state.f.jobs) chips.push(["jobs", "1", "Есть вакансии"]);
  if (state.f.verified) chips.push(["verified", "1", "Документы проверены"]);
  return chips;
}

function filtersMarkup() {
  const all = [...COMPANIES, ...DIRECTORY];
  const group = (title, key, values, has) => `<fieldset class="fgroup" style="border:0;margin:0;padding:0"><legend class="sr-only">${title}</legend><b>${title}</b>${values.map((v) => `
    <label class="check"><input type="checkbox" data-filter="${key}" value="${esc(v)}" ${state.f[key].has(v) ? "checked" : ""}><span>${v}</span><span class="c num">${all.filter((c) => has(c, v)).length}</span></label>`).join("")}</fieldset>`;
  return `${group("Тип компании", "type", TYPES, (c, v) => c.type === v)}
    ${group("Услуги", "cat", CATS, (c, v) => c.cats.includes(v))}
    <label class="toggle-row"><span>Есть вакансии</span><input class="switch" type="checkbox" data-filter="jobs" ${state.f.jobs ? "checked" : ""}></label>
    <label class="toggle-row"><span>Документы проверены</span><input class="switch" type="checkbox" data-filter="verified" ${state.f.verified ? "checked" : ""}></label>`;
}

function card(c) {
  const dir = isDir(c), mine = isMine(c), n = vacCount(c);
  let action = "";
  if (mine) action = `<a class="btn sm" href="${pageHref("/dashboard")}">${icon("edit")}Редактировать</a>`;
  else if (!dir && state.role === "worker" && n) action = `<a class="btn sm" href="#/v/${c.id}/jobs">Вакансии<span class="count">${n}</span></a>`;
  else if (!dir) action = `<button class="btn sm" data-act="write" data-id="${c.id}">${icon("message")}Написать</button>`;
  const branches = c.branches ? c.branches.length : 1;
  return `<article class="card ${mine ? "mine" : ""}">
    <div class="c-main">
      ${mine ? `<span class="mine-tag">${icon("dot")}Ваша компания</span>` : ""}
      <h2 class="c-title"><a href="#/${dir ? "d" : "v"}/${c.id}">${esc(c.name)}</a>${c.verified ? verifiedMark("company") : ""}</h2>
      <div class="c-org">${c.type}, ${c.city}${branches > 1 ? `, ${plural(branches, "филиал", "филиала", "филиалов")}` : ""}</div>
      <div class="meta">
        ${dir ? `<span>${icon("info")}Компания не подтвердила карточку</span>` : `<span>${icon("star")}${c.rating}/10, ${reviewsWord(c.reviews)}</span>`}
        <span>${icon("clock")}${c.hours}</span>
        ${n ? `<span>${icon("briefcase")}${jobsWord(c.jobs.filter(([k]) => k === "vacancy").length)}, ${plural(c.jobs.filter(([k]) => k === "gig").length, "подработка", "подработки", "подработок")}</span>` : ""}
      </div>
      <p class="c-desc">${services(c).join(", ")}</p>
    </div>
    <div class="c-side">
      ${dir ? "" : `<div class="money num">от ${fmt(Math.min(...c.services.map(([, , p]) => p)))} ₽<small>${esc(c.services.reduce((a, b) => b[2] < a[2] ? b : a)[0].toLowerCase())}</small></div>`}
      <div class="c-actions">${action}</div>
    </div>
  </article>`;
}

function resultsMarkup() {
  const items = filtered(), chips = activeChips();
  const word = plural(items.length, "компания", "компании", "компаний");
  const note = state.role === "supplier" ? `<div class="note">${icon("info")}<p>Студии сами публикуют, что им нужно купить: <a href="${pageHref("/supply-requests")}">заявки на закупку</a></p></div>` : "";
  return `<div class="toolbar">
      <p class="count"><b class="num">${word.split(" ")[0]}</b> ${word.split(" ").slice(1).join(" ")}</p>
      <button class="btn sm filters-btn" data-act="sheet">${icon("sliders")}Фильтры${chips.length ? `<span class="badge-n num">${chips.length}</span>` : ""}</button>
      <div class="sort-wrap">${dd({ key: "sort", value: state.sort, options: SORTS, variant: "compact", label: "Сортировка" })}</div>
    </div>
    ${chips.length ? `<div class="chips">${chips.map(([k, v, l]) => `<button class="chip" data-act="unchip" data-k="${k}" data-v="${esc(v)}">${esc(l)}${icon("x")}</button>`).join("")}<button class="link" data-act="reset" style="font-size:13px">Сбросить всё</button></div>` : ""}
    ${note}
    ${items.length ? `<div class="list">${items.map(card).join("")}</div>`
      : `<div class="empty">${icon("search", "lg")}<h3>Компании не найдены</h3><p>Попробуйте другой город или уберите часть фильтров</p><button class="btn" data-act="reset">Сбросить фильтры</button></div>`}`;
}

function catalogView() {
  document.body.className = "catalog-page";
  document.title = "Компании · СОУС";
  const head = (search) => `<section class="head"><div class="wrap head-in">
      <div class="head-row"><h1>Компании</h1><a class="btn" href="${pageHref("/sous-map")}">${icon("pin")}<span class="l-full">На карте</span><span class="l-short">Карта</span></a></div>
      <p class="lead">Автомойки, детейлинг-центры и автосервисы: услуги и цены, филиалы, вакансии и отзывы</p>
      ${search ? `<form class="search" role="search" data-act-submit="search">
        <label class="s-field"><span class="sr-only">Поиск</span>${icon("search", "lg")}<input id="q" type="search" value="${esc(state.q)}" placeholder="Название, район или услуга" autocomplete="off"></label>
        <div class="s-field s-city">${dd({ key: "search-city", name: "city", value: state.city, options: CITIES, variant: "bare", iconName: "pin", label: "Город" })}</div>
        <button class="btn primary" type="submit">Найти</button>
      </form>` : ""}
    </div></section>`;
  if (state.role === "employer") return `${head(false)}<div class="wrap" style="padding:8px 0 96px"><div class="empty">
      <h3>Каталог компаний закрыт для работодателей</h3>
      <p>Его смотрят автовладельцы и специалисты</p>
      <div class="parts"><a class="btn primary" href="#/v/${MY_COMPANY}">Профиль Shine&Go</a><a class="btn" href="${pageHref("/specialists")}">${icon("users")}Найти специалистов</a></div>
    </div></div>`;
  return `${head(true)}
    <div class="wrap catalog">
      <aside class="filters" aria-label="Фильтры">
        <div class="filters-head"><h2>Фильтры</h2>${activeChips().length ? `<button class="link" data-act="reset" style="font-size:13px">Сбросить</button>` : ""}</div>
        ${filtersMarkup()}
      </aside>
      <section id="results" aria-live="polite">${resultsMarkup()}</section>
    </div>`;
}

/* =========================================================
   Профиль компании
   ========================================================= */
function detailView(id) {
  const c = COMPANIES.find((x) => x.id === id);
  if (!c) return missing();
  document.body.className = "detail-page";
  document.title = `${c.name} · ${c.type} · СОУС`;
  const r = state.role, mine = isMine(c), guest = r === "guest";
  const vac = c.jobs.filter(([k]) => k === "vacancy").length;
  const followed = state.followed.has(c.id), phone = state.phones.has(c.id);
  const followBtn = `<button class="btn block" data-act="follow" data-id="${c.id}" aria-pressed="${followed}">${icon(followed ? "check" : "plus")}${followed ? "Вы подписаны" : "Подписаться"}</button>`;
  const phoneRow = `<div class="contact-mask">${icon("phone")}<span class="num">${phone ? "+7 (843) 210-14-25" : "+7 (8••) •••-••-••"}</span>${phone ? "" : `<button class="link" data-act="phone" data-id="${c.id}" style="margin-left:auto;font-size:13px">Показать</button>`}</div>`;

  let card, mbar;
  if (mine) {
    card = `<section class="panel action-card">
      <span class="mine-tag">${icon("dot")}Это ваша компания</span>
      <a class="btn primary lg block" href="${pageHref("/dashboard")}">${icon("edit")}Редактировать профиль</a>
      <a class="btn block" href="${pageHref("/vacancies")}">${icon("briefcase")}Вакансии и подработки</a>
    </section>`;
    mbar = `<a class="btn primary" href="${pageHref("/dashboard")}">Редактировать</a>`;
  } else {
    const primary = r === "worker" && c.jobs.length
      ? `<button class="btn primary lg block" data-act="goto" data-id="jobs">${icon("briefcase")}Вакансии<span class="count">${c.jobs.length}</span></button><button class="btn block" data-act="write" data-id="${c.id}">${icon("message")}Написать компании</button>`
      : `<button class="btn primary lg block" data-act="write" data-id="${c.id}">${icon("message")}Написать компании</button>`;
    card = `<section class="panel action-card">
      <div class="money num">${c.rating}/10<small>${reviewsWord(c.reviews)}</small></div>
      ${primary}
      ${followBtn}
      ${phoneRow}
    </section>`;
    mbar = r === "worker" && c.jobs.length ? `<button class="btn primary" data-act="goto" data-id="jobs">Вакансии</button>` : `<button class="btn primary" data-act="write" data-id="${c.id}">Написать</button>`;
  }

  const related = COMPANIES.filter((x) => x.id !== c.id && (x.type === c.type || x.city === c.city)).slice(0, 3);
  return `<div class="wrap detail">
    <a class="back" href="#/">${icon("back")}Все компании</a>
    <div class="d-grid">
      <div class="d-main">
        <section class="panel d-head">
          <div class="d-person"><span class="tile sq" aria-hidden="true">${initials(c.name)}</span><div>
            <h1>${esc(c.name)}</h1>
            <p>${c.type}</p>
            <div class="sub">${c.verified ? `<span class="verified">${icon("badge")}Документы проверены</span>` : ""}<span>${c.city}</span><span>На СОУС с ${c.since}</span></div>
          </div></div>
          <div class="facts c-facts">
            <div><b class="num">${c.rating}/10</b><span>${reviewsWord(c.reviews)}</span></div>
            <div><b class="num">${c.branches.length}</b><span>${plural(c.branches.length, "филиал", "филиала", "филиалов").split(" ")[1]}</span></div>
            <div><b class="num">${vac}</b><span>${jobsWord(vac).split(" ")[1]}</span></div>
            <div><b>${c.hours}</b><span>режим работы</span></div>
          </div>
        </section>
        <section class="panel"><h2>О компании</h2><p class="prose">${esc(c.desc)}</p><div class="skills">${c.cats.map((k) => `<span>${k}</span>`).join("")}</div></section>
        <section class="panel"><h2>Услуги и цены</h2><div class="prices">${c.services.map(([n, d, p]) => `<div class="price"><div><b>${n}</b>${d ? `<span>${d}</span>` : ""}</div><span class="num">от ${fmt(p)} ₽</span>${r === "client" || guest ? `<button class="btn sm" data-act="book" data-id="${c.id}" data-v="${esc(n)}">Записаться</button>` : "<span></span>"}</div>`).join("")}</div></section>
        <section class="panel"><h2>Филиалы<span class="count">${c.branches.length}</span></h2><div class="branches">${c.branches.map(([n, city, a]) => `<div class="branch">${icon("pin")}<div><b>${n}</b><span>${guest ? city : `${city}, ${a}`}</span></div>${guest ? `<button class="link" data-act="addr" data-id="${c.id}">Показать адрес</button>` : "<span></span>"}</div>`).join("")}</div></section>
        <section class="panel" id="jobs"><h2>Вакансии и подработки<span class="count">${c.jobs.length}</span></h2>
          ${c.jobs.length ? `<div class="jobs">${c.jobs.map((j) => `<a class="job" href="${jobHref(j)}"><div><b>${esc(j[2])}</b><span>${j[0] === "gig" ? "Подработка" : "Вакансия"}</span></div><span class="num">${j[3]}</span>${icon("right")}</a>`).join("")}</div>` : `<p class="prose">Сейчас открытых вакансий нет</p>`}
        </section>
        <section class="panel"><h2>Портфолио</h2><div class="gallery">${c.works.map((w) => `<figure>${icon("image")}<figcaption>${esc(w)}</figcaption></figure>`).join("")}</div></section>
        <section class="panel"><h2>Отзывы</h2>
          <div class="rating-sum"><b class="num">${c.rating}/10</b><span>${reviewsWord(c.reviews)}<br>от клиентов и сотрудников</span></div>
          <div class="reviews">${c.reviewsList.map(([au, d, t]) => `<article class="review"><p>${esc(t)}</p><footer><b>${esc(au)}</b><span>${d}</span></footer></article>`).join("")}</div>
        </section>
        ${mine ? "" : `<button class="report" data-act="report">${icon("flag")}Пожаловаться на компанию</button>`}
      </div>
      <aside class="aside">${card}</aside>
    </div>
    ${related.length ? `<section class="related">
      <h2>Похожие компании</h2>
      <div class="related-grid">${related.map((x) => `<a class="mini" href="#/v/${x.id}"><b>${esc(x.name)}</b><span>${x.type}, ${x.city}</span><span class="money num">${x.rating}/10</span></a>`).join("")}</div>
    </section>` : ""}
  </div>
  ${mbar ? `<div class="mbar"><div class="money num">${c.rating}/10<small>${reviewsWord(c.reviews)}</small></div>${mbar}</div>` : ""}`;
}

/* =========================================================
   Карточка открытого каталога: компания ещё не на СОУС
   ========================================================= */
function directoryView(id) {
  const c = DIRECTORY.find((x) => x.id === id);
  if (!c) return missing();
  document.body.className = "detail-page";
  document.title = `${c.name} · Открытый каталог · СОУС`;
  const r = state.role, claimed = state.claimed.has(c.id);
  const canClaim = r === "guest" || r === "employer";
  const card = `<section class="panel action-card">
    ${canClaim ? (claimed
      ? `<span class="btn lg block done">${icon("check")}Заявка на проверке</span>`
      : `<button class="btn primary lg block" data-act="claim" data-id="${c.id}">Это моя компания</button>`) : ""}
    <a class="btn ${canClaim ? "" : "primary lg "}block" href="tel:${c.phone.replace(/[^\d+]/g, "")}">${icon("phone")}${c.phone}</a>
  </section>`;
  return `<div class="wrap detail">
    <a class="back" href="#/">${icon("back")}Все компании</a>
    <div class="d-grid">
      <div class="d-main">
        <section class="panel d-head">
          <div class="d-person"><span class="tile sq" aria-hidden="true">${initials(c.name)}</span><div>
            <h1>${esc(c.name)}</h1>
            <p>${c.type}</p>
            <div class="sub"><span>${c.city}</span><span>Открытый каталог</span></div>
          </div></div>
          <p class="dir-line">${icon("info")}Компания ещё не подтвердила карточку: данные могут быть неточными</p>
          <div class="facts d-facts">
            <div><b>${c.address}</b><span>адрес</span></div>
            <div><b class="num">${c.phone}</b><span>телефон</span></div>
            <div><b>${c.hours}</b><span>режим работы</span></div>
            <div><b>Нет</b><span>отзывов</span></div>
          </div>
        </section>
        <section class="panel"><h2>Услуги</h2><div class="skills" style="margin-top:0">${c.services.map((s) => `<span>${s}</span>`).join("")}</div></section>
      </div>
      <aside class="aside">${card}</aside>
    </div>
  </div>
  <div class="mbar"><div class="money num" style="font-size:16px">${c.name}<small>${c.type}</small></div><a class="btn primary" href="tel:${c.phone.replace(/[^\d+]/g, "")}">Позвонить</a></div>`;
}

function missing() {
  return `<div class="wrap detail"><a class="back" href="#/">${icon("back")}Все компании</a><div class="empty"><h3>Компания не найдена</h3><p>Профиль удалён или скрыт</p><a class="btn" href="#/">К компаниям</a></div></div>`;
}

/* =========================================================
   Окна
   ========================================================= */
const TOPICS = ["Запись на услугу", "Вопрос об услуге", "Работа в компании", "Другое"];
function writeModal(id, service = "") {
  const c = byId(id);
  const topic = service ? "Запись на услугу" : state.role === "worker" ? "Работа в компании" : "Вопрос об услуге";
  openModal(`${mHead(service ? "Запись на услугу" : "Сообщение компании", esc(c.name))}
    <form class="m-body" id="mform">
      ${service ? `<div class="grid2">
        <div class="field"><span>Услуга</span>${dd({ key: "m-service", name: "service", value: service, options: c.services.map(([n, , p]) => [n, n, `от ${fmt(p)} ₽`]) })}</div>
        <div class="field"><span>Дата</span>${datePick({ key: "m-date", name: "date", value: "2026-11-27", min: "2026-11-25", label: "Дата" })}</div>
      </div>
      <div class="field"><span>Филиал</span>${dd({ key: "m-branch", name: "branch", value: c.branches[0][0], options: c.branches.map(([n, city, a]) => [n, n, `${city}, ${a}`]) })}</div>`
      : `<div class="field"><span>Тема</span>${dd({ key: "m-topic", name: "topic", value: topic, options: TOPICS })}</div>`}
      <label class="field"><span>Сообщение</span><textarea class="textarea" name="msg" placeholder="${service ? "Марка и модель автомобиля, удобное время" : "Ваш вопрос"}" autofocus></textarea></label>
    </form>
    <div class="m-foot"><button class="btn" data-act="close">Отмена</button><button class="btn primary" data-act="write-send" data-id="${id}">${icon("send")}${service ? "Записаться" : "Отправить"}</button></div>`);
}
function writeSuccess(id, booked) {
  const c = byId(id);
  $("#modal-root .modal").innerHTML = `${mHead("", "")}<div class="m-body"><div class="success"><span class="ok-circle">${icon("check")}</span><h3>${booked ? "Заявка на запись отправлена" : "Сообщение отправлено"}</h3><p>${esc(c.name)} ответит в «Сообщениях»</p></div></div>
    <div class="m-foot"><button class="btn" data-act="close">Готово</button><a class="btn primary" href="${pageHref("/messages")}">Перейти к диалогу</a></div>`;
}
function claimModal(id) {
  const c = byId(id);
  openModal(`${mHead("Подтвердить компанию", esc(c.name))}
    <form class="m-body" id="mform">
      <label class="field"><span>ИНН компании или ИП</span><input class="input num" name="inn" inputmode="numeric" required autofocus placeholder="10 или 12 цифр"></label>
      <div class="field"><span>Ваша роль</span>${dd({ key: "m-role", name: "role", value: "Владелец", options: ["Владелец", "Управляющий", "Администратор"] })}</div>
      <div class="field"><span>Выписка ЕГРЮЛ или ЕГРИП</span><div><label class="btn file-btn" style="cursor:pointer">${icon("upload")}<input class="sr-only" type="file" accept="application/pdf,image/*" data-file><span>Прикрепить файл</span></label></div></div>
    </form>
    <div class="m-foot"><button class="btn" data-act="close">Отмена</button><button class="btn primary" data-act="claim-send" data-id="${id}">Отправить на проверку</button></div>`);
}
function reportModal() {
  openModal(`${mHead("Пожаловаться на компанию")}
    <form class="m-body" id="mform">
      ${["Неверные данные или цены", "Компания закрыта", "Мошенничество", "Другое"].map((t, i) => `<label class="check"><input type="radio" name="r" style="border-radius:50%" ${i === 0 ? "checked" : ""}><span>${t}</span></label>`).join("")}
      <label class="field"><span>Комментарий</span><textarea class="textarea" placeholder="Что не так"></textarea></label>
    </form>
    <div class="m-foot"><button class="btn" data-act="close">Отмена</button><button class="btn primary" data-act="report-send">Отправить</button></div>`);
}
function filtersSheet() {
  openModal(`${mHead("Фильтры")}<div class="m-body"><div class="sheet-filters" id="sheet"><div class="field"><span>Сортировка</span>${dd({ key: "sort", value: state.sort, options: SORTS, label: "Сортировка" })}</div>${filtersMarkup()}</div></div>
    <div class="m-foot"><button class="btn" data-act="reset">Сбросить</button><button class="btn primary" data-act="close" id="sheet-apply">Показать: ${filtered().length}</button></div>`);
}

/* =========================================================
   Обновление списка
   ========================================================= */
const BOOL = ["jobs", "verified"];
function renderResults() {
  const el = $("#results");
  if (el) el.innerHTML = resultsMarkup();
  const fh = $(".filters-head");
  if (fh) fh.innerHTML = `<h2>Фильтры</h2>${activeChips().length ? `<button class="link" data-act="reset" style="font-size:13px">Сбросить</button>` : ""}`;
  const sa = $("#sheet-apply");
  if (sa) sa.textContent = `Показать: ${filtered().length}`;
}
function syncFilterInputs() {
  $$("[data-filter]").forEach((el) => { const k = el.dataset.filter; el.checked = BOOL.includes(k) ? state.f[k] : state.f[k].has(el.value); });
  $$('[data-dd="sort"]').forEach((el) => setDD(el, state.sort));
  $$('[data-dd="search-city"]').forEach((el) => setDD(el, state.city));
}
function resetFilters() {
  state.f = emptyFilters(); state.city = "Все города"; state.q = "";
  const q = $("#q"); if (q) q.value = "";
  syncFilterInputs(); renderResults();
}
function goto(id) {
  const s = $("#" + id);
  if (s) s.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
}

document.addEventListener("input", (e) => { if (e.target.id === "q") { state.q = e.target.value; renderResults(); } });
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.file !== undefined && t.type === "file") { t.nextElementSibling.textContent = t.files.length ? "Файл прикреплён" : "Прикрепить файл"; return; }
  const k = t.dataset.filter;
  if (!k) return;
  if (BOOL.includes(k)) state.f[k] = t.checked;
  else t.checked ? state.f[k].add(t.value) : state.f[k].delete(t.value);
  syncFilterInputs(); renderResults();
});
document.addEventListener("submit", (e) => { e.preventDefault(); if (e.target.dataset.actSubmit === "search") $("#results")?.scrollIntoView({ behavior: "smooth", block: "start" }); });

/* =========================================================
   Описание страницы
   ========================================================= */
const PAGE = {
  section: "/companies",
  currentPath: () => route().startsWith("/v/") ? "/companies/:id" : route().startsWith("/d/") ? "/companies/directory/:id" : "/companies",
  render() {
    const r = route(), v = r.match(/^\/v\/([\w-]+)/), d = r.match(/^\/d\/([\w-]+)/);
    $("#app").innerHTML = v ? detailView(v[1]) : d ? directoryView(d[1]) : catalogView();
    if (r.endsWith("/jobs")) setTimeout(() => goto("jobs"), 50);
  },
  onDD(key, v) {
    if (key === "search-city") state.city = v;
    else if (key === "sort") state.sort = v;
    else return false;
    syncFilterInputs(); renderResults();
    return true;
  },
  authText(kind) {
    return {
      write: ["Войдите, чтобы написать", "Переписка с компанией хранится в «Сообщениях»"],
      book: ["Войдите, чтобы записаться", "После входа вернём вас к записи"],
      phone: ["Войдите, чтобы увидеть телефон", ""],
      addr: ["Войдите, чтобы увидеть адрес", ""],
      follow: ["Войдите, чтобы подписаться", "Новости и акции компании появятся в вашей ленте"],
      claim: ["Войдите как компания", "После входа отправите карточку на проверку"],
    }[kind];
  },
  loginRole: (p) => p.kind === "claim" ? "employer" : "client",
  afterLogin(p) {
    if (p.kind === "write") setTimeout(() => writeModal(p.id), 200);
    if (p.kind === "book") setTimeout(() => writeModal(p.id.split("|")[0], p.id.split("|")[1]), 200);
    if (p.kind === "phone") { state.phones.add(p.id); render(); }
    if (p.kind === "follow") { state.followed.add(p.id); render(); }
    if (p.kind === "claim") setTimeout(() => claimModal(p.id), 200);
  },
  roleHints: { guest: "смотрит без входа", client: "ищет студию", worker: "ищет работодателя", employer: "каталог закрыт", supplier: "ищет клиентов", partner: "смотрит компании" },
  actions: {
    reset: resetFilters,
    unchip: (el) => {
      const { k, v } = el.dataset;
      if (k === "city") state.city = "Все города";
      else if (BOOL.includes(k)) state.f[k] = false;
      else state.f[k].delete(v);
      syncFilterInputs(); renderResults();
    },
    sheet: filtersSheet,
    goto: (el, e, id) => goto(id),
    write: (el, e, id) => { if (!needAuth("write", id)) writeModal(id); },
    book: (el, e, id) => { if (!needAuth("book", `${id}|${el.dataset.v}`)) writeModal(id, el.dataset.v); },
    "write-send": (el, e, id) => writeSuccess(id, !!$("#mform [name=service]")),
    phone: (el, e, id) => { if (!needAuth("phone", id)) { state.phones.add(id); render(); } },
    addr: (el, e, id) => needAuth("addr", id),
    follow: (el, e, id) => {
      if (needAuth("follow", id)) return;
      state.followed.has(id) ? state.followed.delete(id) : state.followed.add(id);
      render();
    },
    claim: (el, e, id) => { if (!needAuth("claim", id)) claimModal(id); },
    "claim-send": (el, e, id) => {
      const inn = $("#mform [name=inn]");
      if (!/^\d{10}(\d{2})?$/.test(inn.value.replace(/\s/g, ""))) { inn.focus(); toast("Проверьте ИНН", "10 цифр у компании, 12 у ИП", "info"); return; }
      state.claimed.add(id); closeModal(); render();
      toast("Заявка отправлена", "Проверка обычно занимает один рабочий день");
    },
    report: reportModal,
    "report-send": () => { closeModal(); toast("Жалоба отправлена", "Ответ придёт в уведомления"); },
  },
};

start();
</script>
</body>
</html>
