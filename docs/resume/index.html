<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Резюме · СОУС</title>
<meta name="description" content="Переработанное создание и редактирование резюме специалиста СОУС: быстрый старт без регистрации и редактор с автосохранением">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alumni+Sans:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/sous.css?v=202611280343">
<style>
/* Быстрый старт */
.rs-new{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start;padding:8px 0 96px}
.rs-form{display:grid;gap:20px}
.rs-form .rs-send{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.rs-next{display:grid;gap:16px}
.rs-next h2{font-size:18px;font-weight:600}
.rs-next ol{display:grid;gap:16px;list-style:none;margin:0;padding:0}
.rs-next li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;font-size:14px;color:var(--text-2)}
.rs-next li b{display:block;color:var(--text);font-weight:600}
.rs-next .n{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--fill-2);font-size:13px;font-weight:600;color:var(--text)}
.rs-state{padding:24px 0 96px}

/* Что ищу: три плашки, работа и подработки сочетаются, «Не ищу» исключает обе */
.seek{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.seek-opt{position:relative;display:grid;gap:4px;align-content:start;padding:16px;border-radius:12px;background:var(--fill);text-align:left;transition:background-color .16s var(--ease)}
.seek-opt:hover{background:var(--fill-2)}
.seek-opt>.icon{width:20px;height:20px;margin-bottom:8px;color:var(--text-3)}
.seek-opt b{font-size:14px;font-weight:600;color:var(--text)}
.seek-opt small{font-size:13px;color:var(--text-3)}
.seek-opt .mark{position:absolute;top:16px;right:16px;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--fill-2)}
.seek-opt .mark .icon{width:12px;height:12px;color:#fff;stroke-width:3.4}
.seek-opt[aria-pressed="true"]{background:rgba(238,90,32,.14)}
.seek-opt[aria-pressed="true"]>.icon{color:var(--primary)}
.seek-opt[aria-pressed="true"] .mark{background:var(--primary)}
.seek-opt:disabled{opacity:.4;pointer-events:none}

/* Опыт в годах: минус, значение словами, плюс */
.stepper{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;min-height:44px;border-radius:var(--r-control);background:var(--fill)}
.stepper:focus-visible{outline:none;box-shadow:var(--ring)}
.stepper button{display:grid;place-items:center;height:44px;border-radius:var(--r-control);color:var(--text-2);transition:background-color .16s var(--ease),color .16s var(--ease)}
.stepper button:hover{background:var(--fill-2);color:var(--text)}
.stepper button:disabled{opacity:.3;pointer-events:none}
.stepper output{text-align:center;font-size:14px;font-weight:500}

/* Редактор */
.rs-top{margin-bottom:24px}
.rs-top h1{font:700 48px/1 var(--font-display)}
.rs-top p{margin-top:8px;font-size:15px;color:var(--text-2)}
.rs-edit .panel{scroll-margin-top:88px}
.rs-edit .panel h2{display:flex;align-items:center;gap:8px}
.fields{display:grid;gap:16px}
.checks{display:flex;flex-wrap:wrap;gap:4px 24px}
.basics{display:grid;grid-template-columns:112px minmax(0,1fr);gap:24px;align-items:start}
.ava{position:relative;width:112px;height:112px}
.ava .tile,.ava-big .tile{width:112px;height:112px;border-radius:50%;font:600 36px/1 var(--font-sans)}
.tile.ph{background:linear-gradient(135deg,#8a4524,#2b1a11);color:rgba(255,255,255,.85)}
.tile.ph .icon{width:44px;height:44px;stroke-width:1.6}
.ava-edit.btn{position:absolute;right:0;bottom:0;width:36px;min-height:36px;padding:0;border-radius:50%;background:var(--surface-2);box-shadow:0 0 0 4px var(--surface)}
.ava-edit.btn:hover{background:#2c231e}
.ava-big{display:grid;place-items:center;padding:8px 0}
.ava-big .tile{width:160px;height:160px;font-size:48px}
.skill-edit{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sk-box{position:relative}
.sk-box>.icon{position:absolute;left:12px;top:14px;color:var(--text-3);pointer-events:none}
.sk-box .input{padding-left:40px}
.sk-pop{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;display:grid;gap:2px;max-height:300px;overflow:auto;padding:6px;border-radius:12px;background:var(--surface-2);box-shadow:var(--shadow),0 0 0 1px var(--fill);animation:rise .16s var(--ease)}
.sk-pop[hidden]{display:none}
.sk-pop .lbl{padding:6px 10px 4px;font-size:12px;color:var(--text-3)}
.sk-opt{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 10px;border-radius:8px;font-size:14px;color:var(--text-2);text-align:left}
.sk-opt.active{background:var(--fill-2);color:var(--text)}
.sk-opt .icon{color:var(--text-3)}
.sk-opt mark{background:none;color:var(--text);font-weight:600}
.items{display:grid;gap:8px;margin-bottom:12px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start;padding:16px;border-radius:12px;background:var(--fill)}
.item b{display:flex;align-items:center;gap:4px;font-size:15px;font-weight:600}
.item .parts{margin-top:2px;font-size:13px;color:var(--text-3)}
.item p{margin-top:6px;font-size:14px;color:var(--text-2)}
.item-acts{display:flex;gap:4px;margin:-4px -4px 0 0}
.item.locked{background:transparent;box-shadow:inset 0 0 0 1px var(--fill-2)}
.rs-edit .gallery figure .del{position:absolute;top:8px;right:8px;z-index:1;border-radius:50%;background:transparent;color:var(--text-2);opacity:0;transition:opacity .16s var(--ease),background-color .16s var(--ease),color .16s var(--ease)}
.rs-edit .gallery figure:hover .del,.rs-edit .gallery figure:focus-within .del{opacity:1}
@media (hover:none){.rs-edit .gallery figure .del{opacity:1}}
.rs-edit .gallery figure .del:hover,.rs-edit .gallery figure .del:focus-visible{background:rgba(10,5,3,.8);color:var(--text)}
.rs-edit .gallery figure button.open{position:absolute;inset:0;border-radius:12px}
.work-add{display:grid;place-content:center;justify-items:center;gap:6px;aspect-ratio:4/3;border-radius:12px;background:var(--fill);font-size:13px;font-weight:600;color:var(--text-2);transition:background-color .16s var(--ease),color .16s var(--ease)}
.work-add:hover{background:var(--fill-2);color:var(--text)}
.work-add .icon{width:20px;height:20px}
.file-btn{position:relative;cursor:pointer}
.file-btn:focus-within{box-shadow:var(--ring)}
.input[readonly]{color:var(--text-2);cursor:default}
.input[readonly]:hover{background:var(--fill)}

/* Боковая карточка: заполненность, разделы, видимость */
.rs-card{display:grid;gap:16px}
.rs-score{display:grid;gap:4px}
.rs-score b{font:700 44px/1 var(--font-display)}
.rs-score span{font-size:13px;color:var(--text-3)}
.meter{height:6px;border-radius:3px;background:var(--fill-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--primary);transition:width .3s var(--ease)}
.rs-nav{display:grid;gap:2px;margin:0 -8px}
.rs-nav button{display:grid;grid-template-columns:16px minmax(0,1fr);gap:2px 10px;padding:8px;border-radius:8px;text-align:left;font-size:14px;color:var(--text-2);transition:background-color .16s var(--ease)}
.rs-nav button:hover{background:var(--fill);color:var(--text)}
.rs-nav .icon{margin-top:2px;color:var(--text-3)}
.rs-nav .ok .icon{color:var(--ok)}

@media (max-width:960px){
  .rs-new{grid-template-columns:minmax(0,1fr)}
  .rs-edit .aside{order:-1}
  .rs-edit .aside .rs-nav{display:none}
}
@media (max-width:640px){
  .seek{grid-template-columns:1fr}
  .seek-opt{padding:14px 48px 14px 52px}
  .seek-opt>.icon{position:absolute;left:16px;top:16px;margin:0}
  .basics{grid-template-columns:1fr;gap:20px}
  .rs-top h1{font-size:40px}
  .item{padding:14px}
}
</style>
</head>
<body>
<a class="sr-only" href="#app">Перейти к содержимому</a>
<header class="top" id="top"></header>
<main id="app" tabindex="-1"></main>
<footer class="footer" id="footer"></footer>
<div id="modal-root"></div>
<div id="toast-root" class="toasts" aria-live="polite"></div>
<div id="proto-root"></div>

<script src="../shared/pages.js?v=202611280343"></script>
<script src="../shared/sous.js?v=202611280343"></script>
<script>
/* =========================================================
   Резюме: быстрый старт (#/new) и редактор (#/edit)
   /resume/:id и /resumes ведут в раздел «Специалисты»
   ========================================================= */
const SPECS = ["Мойка", "Полировка", "Химчистка", "Керамика", "Оклейка и PPF", "Администратор"];
const SUGGEST = {
  "Мойка": ["Двухфазная мойка", "Уборка салона", "Мойка дисков", "Мойка двигателя", "Сушка без разводов"],
  "Полировка": ["Абразивная полировка", "Восстановление фар", "Работа с толщиномером", "Антидождь", "Полировка стёкол"],
  "Химчистка": ["Химчистка текстиля", "Уход за кожей", "Озонирование", "Чистка потолка"],
  "Керамика": ["Подготовка ЛКП", "Керамика в 2–3 слоя", "Керамика на диски", "Работа под лампами"],
  "Оклейка и PPF": ["Полная оклейка PPF", "Винил", "Ручной раскрой", "Демонтаж плёнок"],
  "Администратор": ["CRM", "Запись клиентов", "Приёмка с фотофиксацией", "Кассовая дисциплина"],
};
const WHEN = [["сегодня и завтра", "Сегодня и завтра"], ["на выходных", "На выходных"], ["по будням", "По будням"], ["со следующей недели", "Со следующей недели"]];
const SCHEDULES = ["Полный день", "Сменный", "Совместительство", "Любой"];
const ALL_SKILLS = () => [...new Set(Object.values(SUGGEST).flat())];
const YEARS = Array.from({ length: 22 }, (_, i) => String(2026 - i));
const MY_PROFILE = "/specialists/worker-001";

/* Резюме Михаила Соколова: то же, что видно в его профиле у специалистов */
const myResume = () => ({
  photo: false, name: "Михаил Соколов", role: "Детейлер: полировка и PPF", spec: "Полировка", city: "Москва", years: "6",
  job: true, off: false, salary: "90000", schedule: "Полный день", gig: true, gigWhen: "на выходных", gigRate: "6000",
  desc: "Шесть лет работаю с лакокрасочными покрытиями и защитными материалами. Восстановительная полировка, керамика и установка полиуретановой плёнки. Показываю процесс, фиксирую результат и отвечаю за каждый этап.",
  skills: ["Восстановительная полировка", "Установка PPF", "Керамические составы", "Химчистка кожи", "Матовое ЛКП", "Фотоотчёт"],
  jobs: [
    { from: "2022", to: "", title: "Старший детейлер", org: "АвтоПрофи, Москва", desc: "Полировка и защита премиальных автомобилей, контроль качества, обучение младших мастеров" },
    { from: "2020", to: "2022", title: "Детейлер", org: "CleanLab, Москва", desc: "Комплексная подготовка автомобилей, химчистка салона, керамика" },
  ],
  certs: [
    { name: "Мастер детейлинга", by: "Учебный центр СОУС", year: "2026", num: "UC-2026-001", sous: true },
    { name: "Установка PPF, продвинутый курс", by: "Wrap Academy", year: "2026", num: "PPF-2026-184", file: true },
  ],
  works: [
    { title: "Полировка капота", spec: "Полировка", car: "BMW X5", desc: "Восстановительная полировка в два этапа, замеры толщиномером" },
    { title: "Восстановление фар", spec: "Полировка", car: "Toyota Camry", desc: "Шлифовка, полировка и защитный лак" },
    { title: "Кузов до и после", spec: "Полировка", car: "Mercedes E-класс", desc: "Полировка и керамика в два слоя" },
  ],
  citizenship: "Россия", license: "Категория B", medbook: "Есть", trips: true, move: false, langs: "Русский, английский базовый",
  phone: "+7 (999) 521-22-51", email: "mike@example.ru", tg: "",
  visible: true,
});

Object.assign(state, { resume: myResume(), draft: null, nseek: { job: true, gig: false, off: false } });
const R = () => state.resume;

/* ---------- Заполненность: 100 баллов по разделам ---------- */
const required = (r) => r.name.trim() && r.role.trim() && r.spec && r.city;
const SECTIONS = [
  ["s-main", "Основное", (r) => ({ got: (required(r) ? 16 : 0) + (r.photo ? 8 : 0), max: 24 })],
  ["s-seek", "Что ищу", (r) => ({ got: (seeks(r, "job") && !r.salary) || (seeks(r, "gig") && !r.gigRate) ? 6 : 12, max: 12 })],
  ["s-about", "О себе", (r) => ({ got: r.desc.trim().length >= 80 ? 10 : 0, max: 10 })],
  ["s-skills", "Навыки", (r) => ({ got: r.skills.length >= 3 ? 8 : 0, max: 8 })],
  ["s-jobs", "Опыт работы", (r) => ({ got: r.jobs.length || r.years === "0" ? 14 : 0, max: 14 })],
  ["s-certs", "Сертификаты", (r) => ({ got: r.certs.length ? 8 : 0, max: 8 })],
  ["s-works", "Портфолио", (r) => ({ got: Math.round(Math.min(r.works.length, 6) / 6 * 10), max: 10 })],
  ["s-extra", "Дополнительно", (r) => ({ got: r.citizenship && r.medbook ? 6 : 0, max: 6 })],
  ["s-contacts", "Контакты", (r) => ({ got: r.email.trim() || r.tg.trim() ? 8 : 0, max: 8 })],
];
const score = (r = R()) => SECTIONS.reduce((s, [, , f]) => s + f(r).got, 0);

/* ---------- Поля ---------- */
const val = (v) => esc(v ?? "");
const inp = (key, label, { ph = "", cls = "", mode = "", small = "", req = false, ro = false } = {}) =>
  `<label class="field"><span>${label}</span><input class="input ${cls}" id="f-${key}" data-f="${key}" value="${val(R()[key])}"${ph ? ` placeholder="${ph}"` : ""}${mode ? ` inputmode="${mode}"` : ""}${req ? " required" : ""}${ro ? " readonly" : ""}>${small ? `<small>${small}</small>` : ""}</label>`;
const chk = (key, label) => `<label class="check"><input type="checkbox" id="f-${key}" data-f="${key}" ${R()[key] ? "checked" : ""}><span>${label}</span></label>`;
/* Что ищу: работа и подработки сочетаются; «Не ищу» отключает обе и помнит выбор до повторного нажатия */
const SEEK = [["job", "briefcase", "Ищу работу", "Постоянную, в штат студии"], ["gig", "zap", "Беру подработки", "Смены на день или выходные"], ["off", "user", "Не ищу", "Резюме останется портфолио"]];
const seekPlates = ({ job, gig, off }, act) => `<div class="seek" role="group" aria-label="Что ищете">${SEEK.map(([v, ic, t, sub]) => {
  const on = v === "off" ? off : !off && (v === "job" ? job : gig), dis = v !== "off" && off;
  return `<button type="button" class="seek-opt" id="${act}-${v}" data-act="${act}" data-v="${v}" aria-pressed="${on}"${dis ? " disabled" : ""}>${icon(ic)}<span class="mark" aria-hidden="true">${on ? icon("check") : ""}</span><b>${t}</b><small>${sub}</small></button>`;
}).join("")}</div>`;
function seekNext(x, v) {
  const n = { ...x };
  if (v === "off") { n.off = !x.off; if (!n.off && !n.job && !n.gig) n.job = true; }
  else { n[v] = !x[v]; if (!n.job && !n.gig) n.off = true; }
  return n;
}
const seeks = (r, k) => !r.off && r[k];

/* Опыт: кнопки минус и плюс, стрелки с клавиатуры. f: поле резюме для автосохранения */
const yearsText = (n) => +n ? plural(+n, "год", "года", "лет") : "Без опыта";
const stepper = (name, value, f = "") => `<div class="stepper" id="st-${name}" role="spinbutton" tabindex="0" aria-label="Опыт в профессии" aria-valuemin="0" aria-valuemax="50" aria-valuenow="${+value}" aria-valuetext="${yearsText(value)}" data-sf="${f}">
  <button type="button" tabindex="-1" data-act="step" data-d="-1" aria-hidden="true"${+value <= 0 ? " disabled" : ""}>${icon("minus")}</button>
  <output>${yearsText(value)}</output>
  <button type="button" tabindex="-1" data-act="step" data-d="1" aria-hidden="true">${icon("plus")}</button>
  <input type="hidden" name="${name}" value="${+value}">
</div>`;
function stepBy(box, d) {
  const input = $("input", box), v = Math.max(0, Math.min(50, (+input.value || 0) + d));
  input.value = v; $("output", box).textContent = yearsText(v);
  box.setAttribute("aria-valuenow", v); box.setAttribute("aria-valuetext", yearsText(v));
  $("button", box).disabled = v <= 0;
  if (box.dataset.sf) { R()[box.dataset.sf] = String(v); saved(); }
}

/* ---------- Быстрый старт ---------- */
function newView() {
  document.title = "Создать резюме · СОУС";
  const r = state.role;
  const head = `<section class="head"><div class="wrap head-in">
    <h1>Создать резюме</h1>
    <p class="lead">Пять полей, и резюме появится в каталоге специалистов. Опыт, сертификаты и портфолио добавите потом в редакторе</p>
  </div></section>`;
  if (r === "worker") return `${head}<div class="wrap rs-state"><div class="empty">
    <h3>Резюме уже есть</h3>
    <p>У специалиста одно резюме. Оно заполнено на ${score()}%: дополните его, чтобы студии чаще приглашали вас</p>
    <div class="parts"><a class="btn primary" href="#/edit">${icon("edit")}Открыть редактор</a><a class="btn" href="${pageHref(MY_PROFILE)}">Как видят работодатели</a></div>
  </div></div>`;
  if (r !== "guest") return `${head}<div class="wrap rs-state"><div class="empty">
    <h3>Резюме создают специалисты</h3>
    <p>${r === "employer" ? "Вы вошли как работодатель. Сотрудников ищите в каталоге специалистов, а вакансию разместите в разделе «Вакансии»" : "Резюме привязано к аккаунту специалиста. Если вы ищете работу в индустрии, войдите как специалист"}</p>
    <div class="parts"><a class="btn primary" href="${pageHref("/specialists")}">${icon("users")}Найти специалистов</a>${r === "employer" ? `<a class="btn" href="${pageHref("/vacancies")}">Разместить вакансию</a>` : ""}</div>
  </div></div>`;
  const d = state.draft || {};
  return `${head}<div class="wrap rs-new">
    <form class="panel rs-form" id="newform" novalidate>
      <div class="grid2">
        <label class="field"><span>Имя и фамилия</span><input class="input" name="name" required autocomplete="name" placeholder="Например, Михаил Соколов" value="${val(d.name)}"></label>
        <div class="field"><span>Город</span>${dd({ key: "n-city", name: "city", value: d.city || "Москва", options: CITIES.slice(1) })}</div>
      </div>
      <label class="field"><span>Кем работаете</span><input class="input" name="role" required placeholder="Например, детейлер: полировка и PPF" value="${val(d.role)}"></label>
      <div class="grid2">
        <div class="field"><span>Специализация</span>${dd({ key: "n-spec", name: "spec", value: d.spec || "Полировка", options: SPECS })}</div>
        <div class="field"><span>Опыт в профессии</span>${stepper("years", d.years || 0)}</div>
      </div>
      <div class="field"><span>Что ищете</span>${seekPlates(state.nseek, "nseek")}</div>
      <div class="rs-send"><button class="btn primary lg" type="button" data-act="new-send">Создать резюме</button></div>
    </form>
    <aside class="panel rs-next">
      <h2>Что будет дальше</h2>
      <ol>
        <li><span class="n">1</span><span><b>Резюме сразу в каталоге</b>Студии видят имя, специализацию, город и что вы ищете</span></li>
        <li><span class="n">2</span><span><b>Дополните в редакторе</b>Опыт, сертификаты и фото работ: такие резюме приглашают чаще</span></li>

function formData(id = "mform") {

/* ---------- Сохранение и перерисовка: правки сохраняются сразу, обновляем карточку справа ---------- */
function saved() {
  const a = $("#rs-aside");
  if (a) a.innerHTML = asideCard();
}
/* перерисовать страницу, не теряя прокрутку и фокус */
function redraw() {
  const id = document.activeElement?.id, y = window.scrollY;
  PAGE.render(); window.scrollTo(0, y);
  if (id) $("#" + id)?.focus();
}
function change(fn, msg) { fn(R()); saved(); redraw(); if (msg) toast(...msg); }
function addSkill(v) {
  v = v.trim();
  if (!v) return;
  if (R().skills.some((x) => x.toLowerCase() === v.toLowerCase())) { toast("Такой навык уже есть", v, "info"); return; }
  change((r) => r.skills.push(v));
  $("#skill-in")?.focus();
}

/* Поиск навыка: подсказки по специализации, совпадения по всем навыкам, свой вариант */
let skActive = -1, skList = [];
function skOptions(raw) {
  const r = R(), have = r.skills.map((x) => x.toLowerCase()), own = SUGGEST[r.spec] || [];
  const base = [...own, ...ALL_SKILLS().filter((x) => !own.includes(x))].filter((x) => !have.includes(x.toLowerCase()));
  const q = raw.trim().toLowerCase();
  if (!q) return ["Часто добавляют", base.slice(0, 6).map((v) => [v, esc(v)])];
  const found = base.filter((x) => x.toLowerCase().includes(q)).slice(0, 7)
    .map((v) => { const i = v.toLowerCase().indexOf(q); return [v, `${esc(v.slice(0, i))}<mark>${esc(v.slice(i, i + q.length))}</mark>${esc(v.slice(i + q.length))}`]; });
  const exists = found.some(([v]) => v.toLowerCase() === q) || have.includes(q);
  return [found.length ? "Подходящие навыки" : "", exists ? found : [...found, [raw.trim(), `Добавить «${esc(raw.trim())}»`]]];
}
function skRender() {
  const input = $("#skill-in"), pop = $("#sk-pop");
  if (!input) return;
  const [label, list] = skOptions(input.value);
  skList = list;
  if (!list.length) { skClose(); return; }
  if (skActive >= list.length) skActive = list.length - 1;
  pop.innerHTML = (label ? `<div class="lbl" aria-hidden="true">${label}</div>` : "") + list.map(([v, l], i) =>
    `<button type="button" class="sk-opt ${i === skActive ? "active" : ""}" role="option" id="sk-o${i}" aria-selected="${i === skActive}" tabindex="-1" data-act="sk-pick" data-v="${esc(v)}">${icon("plus")}<span>${l}</span></button>`).join("");
  pop.hidden = false;
  input.setAttribute("aria-expanded", "true");
  if (skActive >= 0) { input.setAttribute("aria-activedescendant", `sk-o${skActive}`); $(`#sk-o${skActive}`).scrollIntoView({ block: "nearest" }); }
  else input.removeAttribute("aria-activedescendant");
}
function skClose() {
  const input = $("#skill-in"), pop = $("#sk-pop");
  if (pop) pop.hidden = true;
  input?.setAttribute("aria-expanded", "false"); input?.removeAttribute("aria-activedescendant");
  skActive = -1;
}

document.addEventListener("input", (e) => {
  if (e.target.id === "skill-in") { skActive = e.target.value.trim() ? 0 : -1; skRender(); return; }
  const k = e.target.dataset?.f;
  if (!k || e.target.type === "checkbox") return;
  R()[k] = e.target.value;
  const tile = $(".ava .tile:not(.ph)");
  if (k === "name" && tile) tile.textContent = initials(e.target.value || "?");
  saved();
});
document.addEventListener("focusin", (e) => { if (e.target.id === "skill-in") { skActive = -1; skRender(); } });
document.addEventListener("mousemove", (e) => {
  const o = e.target.closest(".sk-opt");
  if (!o) return;
  skActive = +o.id.slice(4);
  document.querySelectorAll(".sk-opt").forEach((x) => x.setAttribute("aria-selected", x === o));
  document.getElementById("skill-in").setAttribute("aria-activedescendant", o.id);
});
document.addEventListener("focusout", (e) => { if (e.target.id === "skill-in") skClose(); });
/* клик по подсказке не должен уводить фокус из поля */
document.addEventListener("mousedown", (e) => { if (e.target.closest(".sk-pop, .stepper button")) e.preventDefault(); });
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset?.photo !== undefined && t.type === "file") { if (t.files.length) { closeModal(); change((r) => { r.photo = true; }, ["Фото загружено", "Оно появится в каталоге и в профиле"]); } return; }
  if (t.dataset?.file !== undefined && t.type === "file") { t.nextElementSibling.textContent = t.files.length ? `Выбрано: ${plural(t.files.length, "файл", "файла", "файлов")}` : "Прикрепить файл"; return; }
  if (t.dataset?.f && t.type === "checkbox") change((r) => { r[t.dataset.f] = t.checked; });
});
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t.id === "skill-in") {
    const open = !$("#sk-pop").hidden;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!open) { skActive = 0; skRender(); return; }
      const n = skList.length;
      skActive = e.key === "ArrowDown" ? (skActive + 1) % n : (skActive - 1 + n) % n;
      skRender();
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (open && skActive >= 0) addSkill(skList[skActive][0]); else addSkill(t.value);
    } else if (e.key === "Escape" && open) { e.stopPropagation(); skClose(); }
    return;
  }
  if (t.classList?.contains("stepper")) {
    const d = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1, PageUp: 5, PageDown: -5 }[e.key];
    if (d) { e.preventDefault(); stepBy(t, d); }
    if (e.key === "Home") { e.preventDefault(); stepBy(t, -99); }
  }
}, true);

  section: "/specialists",

  loginRole: () => "worker",
  afterLogin(p) {
    if (p.kind !== "resume" || !state.draft) return;
    const d = state.draft;
    state.resume = { ...myResume(), photo: false, name: d.name, role: d.role, spec: d.spec, city: d.city, years: d.years || "0", job: d.job, gig: d.gig, off: d.off,
      salary: "", schedule: "Полный день", gigWhen: "на выходных", gigRate: "", desc: "", skills: [], jobs: [], certs: [], works: [], email: "", tg: "", langs: "", trips: false };
    state.draft = null;
    location.hash = "#/edit";
    setTimeout(() => toast("Резюме опубликовано", "Оно уже в каталоге. Дополните опыт и портфолио: так студии пригласят быстрее"), 50);
  },
  roleHints: { guest: "создаёт резюме", worker: "редактирует своё", employer: "не целевая роль", client: "не целевая роль", supplier: "не целевая роль", partner: "не целевая роль" },
  actions: {
    "new-send": () => {
      const d = formData("newform");
      if (!d) return;
      Object.assign(d, state.nseek);
      state.draft = d;
      if (!needAuth("resume")) PAGE.afterLogin({ kind: "resume" });
    },
    goto: (el, e, id) => { const s = $("#" + id); s.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); s.querySelector("input:not([type=hidden]), textarea, .dd-btn, button")?.focus({ preventScroll: true }); },
    visible: (el) => { R().visible = el.checked; saved(); toast(el.checked ? "Резюме снова в поиске" : "Резюме скрыто из поиска", el.checked ? "Студии видят его в каталоге" : "Студии его не видят. Отклики на вакансии работают как раньше"); },
    photo: photoModal,
    "photo-del": () => { closeModal(); change((r) => { r.photo = false; }, ["Фото удалено"]); },
    "sk-pick": (el) => addSkill(el.dataset.v),
    step: (el) => { const box = el.closest(".stepper"); stepBy(box, +el.dataset.d); box.focus(); },
    seek: (el) => change((r) => { Object.assign(r, seekNext(r, el.dataset.v)); }),
    nseek: (el) => {
      state.nseek = seekNext(state.nseek, el.dataset.v);
      el.closest(".seek").outerHTML = seekPlates(state.nseek, "nseek");
      $("#" + el.id).focus();
    },
    "skill-del": (el) => change((r) => r.skills.splice(+el.dataset.i, 1)),
    job: (el) => jobModal(el.dataset.i !== undefined ? +el.dataset.i : null),
    "job-save": (el) => {
      const d = formData(); if (!d) return;
      if (d.to && d.to < d.from) { toast("Проверьте годы", "Окончание раньше начала", "info"); return; }
      const i = el.dataset.i; closeModal();
      change((r) => { i ? (r.jobs[+i] = d) : r.jobs.unshift(d); r.jobs.sort((a, b) => (b.to || "9999").localeCompare(a.to || "9999") || b.from.localeCompare(a.from)); }, [i ? "Место работы сохранено" : "Место работы добавлено"]);
    },
    "job-del": (el) => change((r) => r.jobs.splice(+el.dataset.i, 1), ["Место работы удалено"]),
    cert: (el) => certModal(el.dataset.i !== undefined ? +el.dataset.i : null),
    "cert-save": (el) => {
      const d = formData(); if (!d) return;
      const i = el.dataset.i, f = $("#mform [data-file]");
      const c = { name: d.name, by: d.by, year: d.year, num: d.num, file: f.files.length > 0 || (i ? R().certs[+i].file : false) };
      closeModal();
      change((r) => { i ? (r.certs[+i] = c) : r.certs.push(c); }, [i ? "Сертификат сохранён" : "Сертификат добавлен"]);
    },
    "cert-del": (el) => change((r) => r.certs.splice(+el.dataset.i, 1), ["Сертификат удалён"]),
    work: (el) => workModal(el.dataset.i !== undefined ? +el.dataset.i : null),
    "work-save": (el) => {
      const d = formData(); if (!d) return;
      const i = el.dataset.i; closeModal();
      change((r) => { i ? (r.works[+i] = d) : r.works.push(d); }, [i ? "Работа сохранена" : "Работа добавлена в портфолио"]);
    },
    "work-del": (el) => change((r) => r.works.splice(+el.dataset.i, 1), ["Работа удалена"]),
  },
};

start();
</script>
</body>
</html>
