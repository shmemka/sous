<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кешбэк и акции · СОУС</title>
<meta name="description" content="Кешбэк и акции партнёров СОУС: скидки по QR, растущий кешбэк, фильтры по услугам и активация">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alumni+Sans:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/sous.css?v=202611281321">
<style>
.qr-box{width:176px;height:176px;margin:4px auto 14px;padding:14px;border-radius:14px;background:#fff;display:grid;place-items:center}
.qr-code{text-align:center;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;font-weight:700;letter-spacing:.08em;color:var(--text)}
.qr-sub{text-align:center;font-size:13px;color:var(--text-3);margin-top:6px}
.promo-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:12px;border-radius:var(--r-control);background:var(--fill)}
.promo-facts div{display:grid;gap:2px}
.promo-facts span{font-size:11px;color:var(--text-3)}
.promo-facts b{font-size:13px;font-weight:600}
.scan-box{min-height:220px;border-radius:var(--r-card);background:var(--fill);display:grid;place-items:center;gap:12px;padding:24px;text-align:center;color:var(--text-2)}
.cb-bar{height:8px;border-radius:999px;background:var(--fill-2);overflow:hidden;margin:10px 0 6px}
.cb-bar>span{display:block;height:100%;background:var(--primary);border-radius:inherit}
.receipt-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:var(--r-control);background:var(--fill)}
.receipt-row+.receipt-row{margin-top:8px}
.receipt-st{font-size:12px;font-weight:500;color:var(--ok)}
.receipt-st.pending{color:var(--text-2)}
@media(max-width:520px){.promo-facts{grid-template-columns:1fr}}
</style>
</head>
<body>
<a class="sr-only" href="#app">Перейти к содержимому</a>
<header class="top" id="top"></header>
<main id="app" tabindex="-1"></main>
<footer class="footer" id="footer"></footer>
<div id="modal-root"></div>
<div id="toast-root" class="toasts" aria-live="polite"></div>
<div id="proto-root"></div>

<script src="../shared/pages.js?v=202611281321"></script>
<script src="../shared/sous.js?v=202611281321"></script>
<script>
/* =========================================================
   Кешбэк и акции: данные и состояние
   ========================================================= */
const CATEGORIES = ["Химчистка", "Керамика", "Мойка", "Полировка", "Диагностика", "Кросс-промо"];
const MECHANICS = [["qr", "Скидка по QR"], ["cashback", "Растущий кешбэк"]];
const PROMO_CITIES = ["Все города", "Вся Россия", ...CITIES.slice(1)];
const MY_ORG = "Детейлинг Партнёр";

let PROMOS = [
  {

    city: "Москва",

    terms: ["Действует на полную и частичную химчистку", "Чек нужно загрузить в течение 3 дней после визита", "Выплата по СБП после проверки чека"],

    desc: "Скидка на комплекс восстановительной полировки и нанесения керамического покрытия кузова в два слоя.",
    terms: ["Покажите QR администратору студии до оплаты", "Не суммируется с другими акциями студии", "Предварительная запись обязательна"],
    days: 1,
  },
  {
    id: "promo-003",
    title: "Бесплатная диагностика ЛКП толщиномером",
    org: "АвтоПрофи",
    city: "Санкт-Петербург",
    verified: true,

    benefitSub: "по записи",
    benefitVal: 500,
    until: "До 20 декабря",
    left: "Без ограничений",
    code: "SOUS-2026-3D19",
    desc: "Оценка состояния лакокрасочного покрытия, поиск перекрашенных элементов и рекомендации по полировке или защите плёнкой.",
    terms: ["Длительность осмотра около 20 минут", "Покажите QR мастеру при приёмке", "Действует во всех филиалах сети"],
    days: 2,
  },
  {
    id: "promo-004",
    title: "Скидка 500 ₽ на двухфазную мойку",
    org: "CleanLab",
    city: "Москва",
    verified: true,
    category: "Мойка",

    benefit: "−500 ₽",
    benefitSub: "скидка по QR",
    benefitVal: 500,
    until: "До 10 декабря",
    left: "Осталось 29 из 100",
    code: "SOUS-2026-7A04",
    desc: "Бережная двухфазная мойка кузова, очистка дисков, сушка турбосушкой и уборка ковриков.",
    terms: ["Действует в будние дни с 10:00 до 17:00", "Один QR-код на один визит"],
    days: 3,
  },
  {
    id: "promo-005",
    title: "Кофе и лаунж в подарок при полировке",
    org: "CoffeeBox & Detail",
    city: "Вся Россия",
    verified: false,
    category: "Кросс-промо",
    kind: "qr",
    benefit: "Подарок",
    benefitSub: "кросс-промо",
    benefitVal: 300,
    until: "До 31 декабря",

    desc: "Пока автомобиль проходит полировку или оклейку, получите два авторских напитка в соседней кофейне-партнёре.",
    terms: ["Покажите QR бариста после сдачи автомобиля в работу", "Действует у партнёров сети по всей России"],
    days: 4,
  },
  {
    id: "promo-006",
    title: "Кешбэк 1 500 ₽ на полировку фар",
    org: "Detail House",
    city: "Екатеринбург",
    verified: true,
    category: "Полировка",
    kind: "cashback",
    benefit: "1 500 ₽",
    benefitSub: "кешбэк по чеку",
    benefitVal: 1500,
    until: "До 25 декабря",
    left: "Осталось 12 активаций",
    code: "SOUS-CB-006",
    desc: "Восстановление прозрачности передней оптики с последующей защитой полиуретаном. Возврат части оплаты после загрузки чека.",
    terms: ["Загрузите фото чека в карточке программы", "Выплата в течение 24 часов после подтверждения"],
    days: 5,
  }
];

Object.assign(state, {
  q: "",
  city: "Все города",
  tab: "all",
  myTab: "active",
  scanMode: "manual",
  scanResult: null,
  f: { category: new Set(), kind: new Set(), verified: false },
  sort: "new",
  activated: new Set(["promo-002", "promo-003"]),
  fav: new Set(),
  receipts: [
    { date: "12.11.2026", org: "Детейлинг Партнёр", amount: 8500, status: "Одобрено" },
    { date: "02.11.2026", org: "Детейлинг Партнёр", amount: 6000, status: "Выплачено" }
  ],
  scanHistory: [
    { time: "14:32", title: "Скидка 20% на керамику", note: "Shine&Go" },
    { time: "13:48", title: "Кешбэк до 3 000 ₽", note: "Детейлинг Партнёр" },
    { time: "12:16", title: "Диагностика ЛКП", note: "АвтоПрофи" }
  ],
  payoutBank: "Сбербанк",
});

const isMine = (p) => (state.role === "partner" && p.org === MY_ORG) || (state.role === "employer" && p.org === ROLES.employer.name);

function filtered() {
  const q = state.q.trim().toLowerCase();
  const { category, kind, verified } = state.f;
  let items = PROMOS.filter((p) => {
    if (state.tab !== "all" && p.kind !== state.tab) return false;
    if (q && ![p.title, p.org, p.category, p.desc].join(" ").toLowerCase().includes(q)) return false;
    if (state.city !== "Все города" && p.city !== state.city && p.city !== "Вся Россия") return false;
    if (category.size && !category.has(p.category)) return false;
    if (kind.size && !kind.has(p.kind)) return false;
    if (verified && !p.verified) return false;
    return true;
  });
  items = [...items].sort((a, b) => state.sort === "benefit" ? b.benefitVal - a.benefitVal : a.days - b.days);
  if (state.role === "partner" || state.role === "employer") items.sort((a, b) => isMine(b) - isMine(a));
  return items;
}

function activeChips() {
  const chips = [];
  if (state.city !== "Все города") chips.push(["city", state.city, state.city]);
  state.f.category.forEach((v) => chips.push(["category", v, v]));
  state.f.kind.forEach((v) => chips.push(["kind", v, MECHANICS.find(([k]) => k === v)[1]]));
  if (state.f.verified) chips.push(["verified", "1", "Проверенные партнёры"]);
  return chips;
}

function headAction() {
  if (state.role === "partner" || state.role === "employer") {
    return `<button class="btn primary" data-act="create">${icon("plus")}<span class="l-full">Создать акцию</span><span class="l-short">Акция</span></button>`;
  }
  if (state.role === "client" || state.role === "worker") {
    return `<a class="btn" href="${pageHref("/promos/my")}">${icon("zap")}<span class="l-full">Мои промокоды</span><span class="l-short">Промокоды</span></a>`;
  }
  return `<button class="btn" data-act="create">${icon("plus")}<span class="l-full">Разместить акцию</span><span class="l-short">Акция</span></button>`;
}

function roleNote() {
  if (state.role === "supplier") {
    return `<div class="note">${icon("info")}<p>Здесь размещаются скидки и кешбэк для автовладельцев. Оптовые предложения для студий находятся в <a href="${pageHref("/suppliers")}">каталоге поставщиков</a></p></div>`;
  }
  return "";
}

function filtersMarkup() {
  const catCount = (v) => PROMOS.filter((p) => p.category === v).length;
  const kindCount = (v) => PROMOS.filter((p) => p.kind === v).length;
  return `<fieldset class="fgroup" style="border:0;margin:0;padding:0"><legend class="sr-only">Услуга</legend><b>Услуга</b>
      ${CATEGORIES.filter((v) => catCount(v) || state.f.category.has(v)).map((v) => `<label class="check"><input type="checkbox" data-filter="category" value="${esc(v)}" ${state.f.category.has(v) ? "checked" : ""}><span>${v}</span><span class="c num">${catCount(v)}</span></label>`).join("")}
    </fieldset>
    <fieldset class="fgroup" style="border:0;margin:0;padding:0"><legend class="sr-only">Механика</legend><b>Механика</b>
      ${MECHANICS.map(([k, label]) => `<label class="check"><input type="checkbox" data-filter="kind" value="${k}" ${state.f.kind.has(k) ? "checked" : ""}><span>${label}</span><span class="c num">${kindCount(k)}</span></label>`).join("")}
    </fieldset>
    <label class="toggle-row"><span>Только проверенные партнёры</span><input class="switch" type="checkbox" data-filter="verified" ${state.f.verified ? "checked" : ""}></label>`;
}

function promoCard(p) {
  const mine = isMine(p);
  const active = state.activated.has(p.id);
  let action = "";
  if (mine) {
    action = `<a class="btn sm" href="#/v/${p.id}">Условия и статистика</a>`;
  } else if (p.kind === "cashback") {
    action = active
      ? `<span class="btn sm done">${icon("check")}Вы участвуете</span>`
      : `<button class="btn sm" data-act="activate" data-id="${p.id}">Участвовать</button>`;
  } else {
    action = active
      ? `<button class="btn sm" data-act="qr" data-id="${p.id}">Показать QR</button>`
      : `<button class="btn sm" data-act="activate" data-id="${p.id}">Получить QR</button>`;
  }
  const fav = mine ? "" : `<button class="btn sm ghost icon-only fav" data-act="fav" data-id="${p.id}" aria-pressed="${state.fav.has(p.id)}" aria-label="В избранное">${icon("bookmark", "lg")}</button>`;
  const mechLabel = p.kind === "cashback" ? "Растущий кешбэк" : "По QR";
  return `<article class="card ${mine ? "mine" : ""}">
    <div class="c-main">
      ${mine ? `<span class="mine-tag">${icon("dot")}Ваша акция</span>` : ""}
      <h2 class="c-title"><a href="#/v/${p.id}">${esc(p.title)}</a></h2>
      <div class="c-org">${esc(p.org)}${p.verified ? verifiedMark() : ""}</div>
      <div class="meta"><span>${icon("pin")}${p.city}</span><span>${icon("clock")}${esc(p.until)}</span><span>${icon("zap")}${mechLabel}</span><span>${esc(p.left)}</span></div>
      <p class="c-desc">${esc(p.desc)}</p>
    </div>
    <div class="c-side">
      <div class="money num">${esc(p.benefit)}<small>${esc(p.benefitSub)}</small></div>
      <div class="c-actions">${fav}${action}</div>
    </div>
  </article>`;
}

function catalogView() {
  document.body.className = "catalog-page";
  document.title = "Кешбэк и акции · СОУС";
  const items = filtered();
  const chips = activeChips();
  const word = plural(items.length, "акция", "акции", "акций");
  const tabs = `<div class="tabs" role="tablist" aria-label="Тип акций">
    <button type="button" class="tab" role="tab" aria-selected="${state.tab === "all"}" data-act="tab" data-tab="all">Все акции</button>
    <button type="button" class="tab" role="tab" aria-selected="${state.tab === "cashback"}" data-act="tab" data-tab="cashback">Кешбэк</button>
    <button type="button" class="tab" role="tab" aria-selected="${state.tab === "qr"}" data-act="tab" data-tab="qr">По QR</button>
  </div>`;
  const list = items.length
    ? `<div class="list">${items.map(promoCard).join("")}</div>`
    : `<div class="empty">${icon("search", "lg")}<h3>Акций не нашлось</h3><p>Попробуйте другой город или сбросьте фильтры</p><button class="btn" data-act="reset">Сбросить фильтры</button></div>`;

  return `<section class="head"><div class="wrap head-in">
      <div class="head-row">${tabs}${headAction()}</div>
      <h1>Кешбэк и акции</h1>
      <p class="lead">Скидки по QR-коду и растущий кешбэк от проверенных студий и партнёров</p>
      <form class="search" role="search" data-act-submit="search">
        <label class="s-field"><span class="sr-only">Поиск</span>${icon("search", "lg")}<input id="q" type="search" value="${esc(state.q)}" placeholder="Услуга, акция или студия" autocomplete="off"></label>
        <div class="s-field s-city">${dd({ key: "search-city", name: "city", value: state.city, options: PROMO_CITIES, variant: "bare", iconName: "pin", label: "Город" })}</div>
        <button class="btn primary" type="submit">Найти</button>
      </form>
    </div></section>
    <div class="wrap catalog">
      <aside class="filters" aria-label="Фильтры">
        <div class="filters-head"><h2>Фильтры</h2>${chips.length ? `<button class="link" data-act="reset">Сбросить</button>` : ""}</div>
        <div class="field">${dd({ key: "sort", value: state.sort, options: [["new", "Сначала новые"], ["benefit", "Сначала с большей выгодой"]], label: "Сортировка" })}</div>
        ${filtersMarkup()}
      </aside>
      <section id="results" aria-live="polite">
        <div class="toolbar">
          <p class="count"><b class="num">${word.split(" ")[0]}</b> ${word.split(" ").slice(1).join(" ")}</p>
          <button class="btn sm filters-btn" data-act="sheet">${icon("sliders")}Фильтры${chips.length ? `<span class="badge-n num">${chips.length}</span>` : ""}</button>
        </div>
        ${chips.length ? `<div class="chips">${chips.map(([k, v, l]) => `<button class="chip" data-act="unchip" data-k="${k}" data-v="${esc(v)}" aria-label="Убрать фильтр «${esc(l)}»">${esc(l)}${icon("x")}</button>`).join("")}<button class="link" data-act="reset" style="font-size:13px">Сбросить всё</button></div>` : ""}
        ${roleNote()}
        ${list}
      </section>
    </div>`;
}

function detailView(id) {
  document.body.className = "detail-page";
  const p = PROMOS.find((x) => x.id === id);
  if (!p) return `<div class="wrap detail"><a class="back" href="#/">${icon("back")}Все акции</a><div class="empty"><h3>Акция завершена</h3><p>Посмотрите другие предложения партнёров</p><a class="btn" href="#/">К акциям</a></div></div>`;
  document.title = `${p.title} · ${p.org} · СОУС`;
  const mine = isMine(p);
  const active = state.activated.has(p.id);
  const mechLabel = p.kind === "cashback" ? "Растущий кешбэк" : "Скидка по QR";
  const related = PROMOS.filter((x) => x.id !== p.id).slice(0, 3);

  let card, mbar = "";
  if (mine) {
    card = `<section class="panel action-card">
      <span class="mine-tag">${icon("dot")}Ваша акция</span>
      <div class="stat-row"><div><b class="num">${p.benefit}</b><span>выгода</span></div><div><b class="num">${p.city}</b><span>регион</span></div></div>
      <button class="btn" data-act="unpublish" data-id="${p.id}">Снять акцию</button>
    </section>`;
  } else {
    let mainBtn = "";
    if (p.kind === "cashback") {
      mainBtn = active
        ? `<a class="btn primary lg block" href="${pageHref("/promos/cashback/promo-001")}">Загрузить чек</a>`
        : `<button class="btn primary lg block" data-act="activate" data-id="${p.id}">Участвовать в кешбэке</button>`;
      mbar = active
        ? `<a class="btn primary" href="${pageHref("/promos/cashback/promo-001")}">Загрузить чек</a>`
        : `<button class="btn primary" data-act="activate" data-id="${p.id}">Участвовать</button>`;
    } else {
      mainBtn = active
        ? `<button class="btn primary lg block" data-act="qr" data-id="${p.id}">Показать QR-код</button>`
        : `<button class="btn primary lg block" data-act="activate" data-id="${p.id}">Получить QR-код</button>`;
      mbar = `<button class="btn primary" data-act="${active ? "qr" : "activate"}" data-id="${p.id}">${active ? "Показать QR" : "Получить QR"}</button>`;
    }
    card = `<section class="panel action-card">
      <div class="money num">${esc(p.benefit)}<small>${esc(p.benefitSub)}</small></div>
      ${mainBtn}
      <button class="btn block fav" data-act="fav" data-id="${p.id}" aria-pressed="${state.fav.has(p.id)}">${icon("bookmark")}${state.fav.has(p.id) ? "В избранном" : "Сохранить"}</button>
    </section>`;
  }

  return `<div class="wrap detail">
    <a class="back" href="#/">${icon("back")}Все акции</a>
    <div class="d-grid">
      <div class="d-main">
        <section class="panel d-head">
          <h1>${esc(p.title)}</h1>
          <div class="d-org"><div><b>${esc(p.org)}</b><span class="parts">${p.verified ? `<span class="verified">${icon("badge")}Партнёр проверен</span>` : ""}<span>${p.city}</span></span></div></div>
          <div class="facts">
            <div><b class="num">${esc(p.benefit)}</b><span>${esc(p.benefitSub)}</span></div>
            <div><b>${esc(p.until)}</b><span>срок действия</span></div>
            <div><b>${mechLabel}</b><span>механика</span></div>
            <div><b>${esc(p.left)}</b><span>лимит</span></div>
          </div>
        </section>

function qrSvgMarkup(code) {
  let cells = "";
  let seed = [...code].reduce((a, c) => a + c.charCodeAt(0), 17);
  for (let y = 0; y < 9; y++) {
    for (let x = 0; x < 9; x++) {
      const corner = (x < 3 && y < 3) || (x > 5 && y < 3) || (x < 3 && y > 5);
      seed = (seed * 37 + x * 13 + y * 7) % 97;
      if (corner || seed % 2 === 0) {
        cells += `<rect x="${x * 16}" y="${y * 16}" width="14" height="14" rx="2" fill="#121214"/>`;
      }
    }
  }
  return `<svg width="144" height="144" viewBox="0 0 144 144" aria-hidden="true">${cells}</svg>`;
}

document.addEventListener("input", (e) => {
  if (e.target.id === "q") { state.q = e.target.value; render(); }
});
document.addEventListener("change", (e) => {
  const k = e.target.dataset.filter;
  if (!k) return;
  if (k === "verified") state.f.verified = e.target.checked;
  else e.target.checked ? state.f[k].add(e.target.value) : state.f[k].delete(e.target.value);
  render();
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.dataset.actSubmit === "search") {
    $("#results")?.scrollIntoView({ behavior: "smooth", block: "start" });
  } else if (e.target.dataset.actSubmit === "scan-check") {
    const code = ($("#scanCode")?.value || "").trim().toUpperCase();
    const found = PROMOS.find((p) => p.code === code);
    state.scanResult = found
      ? { ok: true, promo: found, text: `${found.title}, ${found.org} (${found.benefit})` }
      : { ok: false, text: "Проверьте код или попросите клиента обновить QR" };
    render();
  } else if (e.target.dataset.actSubmit === "receipt-send") {
    const d = Object.fromEntries(new FormData(e.target));
    const amount = Number(String(d.amount).replace(/\D/g, "")) || 8500;
    state.receipts.unshift({ date: d.date || "28.11.2026", org: "Детейлинг Партнёр", amount, status: "На проверке" });
    render();
    toast("Чек отправлен", "Начислим кешбэк после проверки");
  }
});

const PAGE = {
  section: "/promos",
  currentPath: () => {
    const r = route();
    if (r === "/my") return "/promos/my";
    if (r === "/scan") return "/promos/scan";
    if (r.startsWith("/cashback/")) return "/promos/cashback/:id";
    if (r.startsWith("/v/")) return "/promos/:id";
    return "/promos";
  },
  render() {
    const r = route();
    if (r === "/my") { $("#app").innerHTML = myPromosView(); return; }
    if (r === "/scan") { $("#app").innerHTML = scanView(); return; }
    const cb = r.match(/^\/cashback\/([\w-]+)/);
    if (cb) { $("#app").innerHTML = cashbackView(cb[1]); return; }
    const m = r.match(/^\/v\/([\w-]+)/);
    $("#app").innerHTML = m ? detailView(m[1]) : catalogView();
  },
  onDD(key, v) {
    if (key === "search-city") state.city = v;
    else if (key === "sort") state.sort = v;
    else if (key === "payout-bank") { state.payoutBank = v; return true; }
    else return false;
    render();
    return true;
  },
  authText(kind, id) {
    return {
      activate: ["Войдите, чтобы активировать акцию", `Промокод «${esc(PROMOS.find((x) => x.id === id)?.title || "")}» сохранится в вашем разделе`],
      fav: ["Войдите, чтобы сохранить", "Избранные акции будут доступны в личном кабинете"],
    }[kind];
  },
  loginRole: () => "client",
  afterLogin(p) {
    if (p.kind === "activate" && p.id) {
      state.activated.add(p.id);
      render();
      const promo = PROMOS.find((x) => x.id === p.id);
      if (promo?.kind === "qr") setTimeout(() => qrModal(p.id), 200);
    }
    if (p.kind === "fav" && p.id) { state.fav.add(p.id); render(); }
  },
  roleHints: {
    guest: "смотрит без входа",
    client: "получает скидки",
    worker: "получает скидки",
    employer: "создаёт акции студии",
    partner: "создаёт акции и кешбэк",
    supplier: "не целевая роль",
  },
  actions: {
    reset: resetFilters,
    tab: (el) => { state.tab = el.dataset.tab; render(); },
    mytab: (el) => { state.myTab = el.dataset.tab; render(); },
    scanmode: (el) => { state.scanMode = el.dataset.mode; state.scanResult = null; render(); },
    "scan-demo": () => {
      const p = PROMOS[1];
      state.scanResult = { ok: true, promo: p, text: `${p.title}, ${p.org} (${p.benefit})` };
      render();
    },
    "scan-apply": () => {
      if (state.scanResult?.promo) {
        state.scanHistory.unshift({ time: "Только что", title: state.scanResult.promo.title, note: state.scanResult.promo.org });
      }
      state.scanResult = null;
      render();
      toast("Скидка применена", "Использование записано в историю");
    },
    "scan-reset": () => { state.scanResult = null; render(); },
    reissue: (el, e, id) => {
      state.activated.add(id);
      state.myTab = "active";
      render();
      toast("QR перевыпущен", "Код готов к показу сотруднику");
    },
    unchip: (el) => {
      const { k, v } = el.dataset;
      if (k === "city") state.city = "Все города";
      else if (k === "verified") state.f.verified = false;
      else state.f[k].delete(v);
      render();
    },
    sheet: filtersSheet,
    details: (el, e, id) => { e.preventDefault(); detailsModal(id); },
    qr: (el, e, id) => qrModal(id),
    activate: (el, e, id) => {
      if (needAuth("activate", id)) return;
      state.activated.add(id);
      render();
      const p = PROMOS.find((x) => x.id === id);
      if (p?.kind === "cashback") {
        closeModal();
        toast("Вы участвуете в программе", "Загрузите чек после оказания услуги");
      } else {
        qrModal(id);
      }
    },
    fav: (el, e, id) => {
      if (needAuth("fav", id)) return;
      state.fav.has(id) ? state.fav.delete(id) : state.fav.add(id);
      toast(state.fav.has(id) ? "Сохранено в избранное" : "Убрано из избранного", "");
      render();
    },
    create: () => createModal(),
    "create-send": () => {
      const f = $("#mform");
      if (!f.reportValidity()) return;
      if (state.role === "guest") {
        closeModal();
        toast("Черновик сохранён", "Войдите как партнёр, чтобы опубликовать");
        setTimeout(() => setRole("partner"), 400);
        return;
      }
      const d = Object.fromEntries(new FormData(f));
      const limit = Number(String(d.limit).replace(/\D/g, "")) || 50;
      PROMOS.unshift({
        id: "promo-" + Date.now(),
        title: d.title,
        org: ROLES[state.role].name,
        city: d.city,
        verified: true,
        category: d.category,
        kind: d.kind,
        benefit: d.benefit,
        benefitSub: d.kind === "cashback" ? "кешбэк на карту" : "скидка по QR",
        benefitVal: 1000,
        until: "До " + d.until,
        left: `Осталось ${limit} активаций`,
        code: "SOUS-2026-" + Math.floor(1000 + Math.random() * 8999),
        desc: d.desc,
        terms: ["Покажите QR до оплаты услуги"],
        days: 0,
      });
      closeModal();
      render();
      toast("Акция опубликована", "Она уже видна в каталоге");
    },
    unpublish: (el, e, id) => {
      PROMOS = PROMOS.filter((x) => x.id !== id);
      closeModal();
      location.hash = "#/";
      render();
      toast("Акция снята с публикации", "");
    },
    report: () => openModal(`${mHead("Пожаловаться на акцию")}
      <form class="m-body" id="mform">
        <label class="field"><span>Причина</span><textarea class="textarea" placeholder="Что не так с акцией"></textarea></label>
      </form>
      <div class="m-foot"><button class="btn" data-act="close">Отмена</button><button class="btn primary" data-act="report-send">Отправить</button></div>`),
    "report-send": () => { closeModal(); toast("Жалоба отправлена", "Мы проверим акцию"); },
  },
};

start();
</script>
</body>
</html>
